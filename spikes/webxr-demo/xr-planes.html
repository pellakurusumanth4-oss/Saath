<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saath AR floor</title>
<!--
  THROWAWAY SPIKE (17 Oct), a copy of index.html that finds the floor with WebXR's own features:
  detected planes (Chrome 147+), then hit tests, then the local-floor origin, and stands Nobita 2.5 m
  ahead on it, held by an anchor. Run: node serve.mjs, adb reverse tcp:8099 tcp:8099, open
  http://localhost:8099/xr-planes.html in Chrome on the phone. ?preview plays a scripted room (a box
  0.9 m ahead, a bed on the left) with a simulated camera; ?preview&old uses index.html's rule there.
-->
<style>
  :root { --ink: #111318; --gold: #FFC83D; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111318; color: #fff; font-family: system-ui, Roboto, sans-serif; }
  canvas.gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #rig { position: fixed; left: 0; top: 0; width: 400px; height: 900px; border: 0; opacity: 0; pointer-events: none; z-index: -1; }
  #intro { position: fixed; left: 16px; right: 16px; top: 28%; text-align: center; font-weight: 700; font-size: 18px; line-height: 1.45; }
  #start { position: fixed; left: 16px; right: 16px; bottom: 36px; padding: 18px; border: 2.5px solid var(--ink); border-radius: 18px;
           background: var(--gold); box-shadow: 3px 3px 0 var(--ink); color: var(--ink); font: 900 20px system-ui, Roboto, sans-serif; }
  #overlay { position: fixed; inset: 0; pointer-events: none; }
  #tip { position: absolute; left: 16px; right: 16px; bottom: 36px; padding: 14px 16px; border-radius: 18px; background: #fff; color: var(--ink);
         border: 2.5px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); font-weight: 800; font-size: 17px; text-align: center; display: none; }
</style>
</head>
<body>
<iframe id="rig" title="Nobita's drawing" aria-hidden="true"></iframe>
<div id="intro">Saath · AR demo<br><span style="font-weight:500;opacity:.8">Nobita on your real floor, tracked by ARCore</span></div>
<button id="start">Loading…</button>
<div id="overlay"><div id="tip"></div></div>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';

const PREVIEW = new URLSearchParams(location.search).has('preview'), OLD = new URLSearchParams(location.search).has('old');
const TALL_M = 1.4;   // Nobita's height (src/friends.ts)
const VFOV = 72.7;    // S24 main camera (notes/ar-stability.md); only the preview camera uses it
const tipEl = document.getElementById('tip'), start = document.getElementById('start'), intro = document.getElementById('intro');
const tip = (s) => { if (tipEl.textContent !== s) tipEl.textContent = s; tipEl.style.display = s ? 'block' : 'none'; };
const canvasTex = (w, h, paint) => {
  const c = Object.assign(document.createElement('canvas'), { width: w, height: h });
  paint(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
};

// ---- Nobita: the app's own 2D rig, copied onto a card that stands on the floor ----------------
// The rig page runs in a same-origin frame with its clock loops removed, so this page drives it
// (renderAt) and copies each new drawing (12 a second) into a canvas texture.
const frame = document.getElementById('rig');
frame.srcdoc = (await (await fetch('nobita.html')).text()).replaceAll('requestAnimationFrame(loop);', '');
await new Promise((r) => frame.addEventListener('load', r, { once: true }));
const rig = frame.contentWindow;
const svg = [...frame.contentDocument.body.children].find((e) => e.tagName === 'svg' && e.querySelector('.head'));
const vb = svg.getAttribute('viewBox').split(/[\s,]+/).map(Number), A = rig.SAATH_AR;
const own = svg.querySelector('.contact'); if (own) own.style.display = 'none';   // he gets a real shadow instead
const PX_H = 1024, PX_W = Math.round((PX_H * vb[2]) / vb[3]);
const art = Object.assign(document.createElement('canvas'), { width: PX_W, height: PX_H }), artG = art.getContext('2d');
const artTex = new THREE.CanvasTexture(art); artTex.colorSpace = THREE.SRGBColorSpace;
let dirty = true, drawing = null;
new MutationObserver(() => (dirty = true)).observe(svg, { attributes: true, childList: true, subtree: true });
const rasterise = () => {
  if (!dirty || drawing) return drawing || Promise.resolve();
  dirty = false;
  const c = svg.cloneNode(true);
  c.removeAttribute('style'); c.setAttribute('width', PX_W); c.setAttribute('height', PX_H); c.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(c)], { type: 'image/svg+xml' }));
  const img = new Image();
  drawing = new Promise((done) => {
    img.onload = () => { artG.clearRect(0, 0, PX_W, PX_H); artG.drawImage(img, 0, 0, PX_W, PX_H); artTex.needsUpdate = true; done(); };
    img.onerror = done;
    img.src = url;
  }).finally(() => { URL.revokeObjectURL(url); drawing = null; });
  return drawing;
};

// ---- The scene: Nobita (card, shadow, speech bubble), the floor ring, the pop-in sparkles -------
const scene = new THREE.Scene();
const unitM = TALL_M / A.tall, cardW = vb[2] * unitM, cardH = vb[3] * unitM;
const cardGeo = new THREE.PlaneGeometry(cardW, cardH);
cardGeo.translate(-((A.ground[0] - vb[0]) / vb[2] - 0.5) * cardW, ((A.ground[1] - vb[1]) / vb[3] - 0.5) * cardH, 0);   // feet at the origin
const card = new THREE.Mesh(cardGeo, new THREE.MeshBasicMaterial({ map: artTex, transparent: true, alphaTest: 0.03 }));
const shadow = new THREE.Mesh(
  new THREE.PlaneGeometry(0.62, 0.62).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, map: canvasTex(128, 128, (g) => {
    const r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    r.addColorStop(0, 'rgba(20,14,8,.55)'); r.addColorStop(0.5, 'rgba(20,14,8,.3)'); r.addColorStop(1, 'rgba(20,14,8,0)');
    g.fillStyle = r; g.fillRect(0, 0, 128, 128);
  }) }),
);
shadow.scale.z = 0.7; shadow.position.y = 0.002; shadow.renderOrder = -1;
const bubble = new THREE.Mesh(
  new THREE.PlaneGeometry(0.95, 0.3),
  new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, map: canvasTex(640, 200, (g, w, h) => {
    g.lineWidth = 8; g.strokeStyle = '#111318'; g.fillStyle = '#fff';
    g.beginPath(); g.roundRect(8, 8, w - 16, h - 64, 44); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(w / 2 - 34, h - 60); g.lineTo(w / 2, h - 10); g.lineTo(w / 2 + 34, h - 60); g.fill(); g.stroke();
    g.fillRect(w / 2 - 30, h - 68, 60, 10);   // opens the bubble's edge into the tail
    g.fillStyle = '#111318'; g.font = '800 64px system-ui, Roboto, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText("Hi! I'm Nobita!", w / 2, (h - 56) / 2 + 6);
  }) }),
);
bubble.position.y = TALL_M + 0.3; bubble.visible = false;
const nobita = new THREE.Group();
nobita.add(shadow, card, bubble); nobita.visible = false; scene.add(nobita);

// The gold ring with footprints that sits on the detected floor before he is called.
const reticle = new THREE.Group(), reticleInner = new THREE.Group();
reticle.matrixAutoUpdate = false; reticle.visible = false; reticle.add(reticleInner); scene.add(reticle);
const flat = (geo, color, opacity = 1) => new THREE.Mesh(geo.rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color, transparent: opacity < 1, opacity, depthWrite: false }));
reticleInner.add(flat(new THREE.CircleGeometry(0.2, 48), 0xffc457, 0.28), flat(new THREE.RingGeometry(0.19, 0.225, 48), 0xffb43c));
for (const x of [-0.065, 0.065]) { const f = flat(new THREE.CircleGeometry(0.04, 20), 0xffc457); f.position.set(x, 0.001, 0); reticleInner.add(f); }

// Sparkles and a dust ring when he pops in (like a Pokémon bursting out of the grass).
let seed = 7; const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const sparkTex = canvasTex(64, 64, (g) => {
  const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.3, 'rgba(255,214,90,1)'); r.addColorStop(1, 'rgba(255,180,60,0)');
  g.fillStyle = r; g.fillRect(0, 0, 64, 64);
});
const sparks = Array.from({ length: 18 }, () => {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: sparkTex, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
  s.visible = false; scene.add(s); return s;
});
const dust = flat(new THREE.RingGeometry(0.85, 1, 48), 0xffe2a6, 0.6); dust.visible = false; scene.add(dust);

let placedAt = null;
const place = (pos, now) => {
  nobita.position.copy(pos); nobita.visible = true; placedAt = now; reticle.visible = false;
  dust.position.copy(pos).setY(pos.y + 0.003);
  sparks.forEach((s, i) => {
    const a = (i / sparks.length) * Math.PI * 2 + rand() * 0.5, sp = 0.45 + rand() * 0.6;
    s.userData = { p0: pos.clone().add(new THREE.Vector3(0, 0.15, 0)), v: new THREE.Vector3(Math.cos(a) * sp, 1.1 + rand() * 1.3, Math.sin(a) * sp), size: 0.06 + rand() * 0.07 };
  });
  rig.saath.play(['hi']);
  tip('Nobita is here! Walk around him.');
};
const backOut = (x) => 1 + 2.70158 * (x - 1) ** 3 + 1.70158 * (x - 1) ** 2;
// Each frame: the pop-in, the sparkles, the bubble, the pulsing ring; he turns to face the camera.
const update = (now, cam) => {
  reticleInner.scale.setScalar(1 + 0.05 * Math.sin(now * 5));
  if (placedAt === null) return;
  const k = now - placedAt;
  card.scale.setScalar(k < 0.45 ? Math.max(0.001, backOut(k / 0.45)) : 1);
  shadow.material.opacity = Math.min(1, k / 0.35);
  bubble.visible = k > 0.35 && k < 3.6;
  dust.visible = k < 0.6;
  if (dust.visible) { dust.scale.setScalar(0.15 + (k / 0.6) * 0.6); dust.material.opacity = 0.6 * (1 - k / 0.6); }
  for (const s of sparks) {
    s.visible = k < 0.9;
    if (!s.visible) continue;
    const { p0, v, size } = s.userData;
    s.position.copy(p0).addScaledVector(v, k).add(new THREE.Vector3(0, -1.6 * k * k, 0));
    s.material.opacity = 1 - k / 0.9; s.scale.setScalar(size * (1 - 0.4 * k));
  }
  nobita.rotation.y = Math.atan2(cam.x - nobita.position.x, cam.z - nobita.position.z);
};

// ---- His spot, from planes as WebXR reports them: { m: pose matrix (Y axis = normal), poly: outline in plane space } ----
// The floor is the lowest big plane facing up (ARCore calls ceilings "horizontal" too). He stands on it 2.5 m
// ahead along the phone's level forward, at the first distance that is on seen floor and not under furniture.
// Why 2.5 m: with the phone 1.4 m up, his feet are 29° below the horizon, the floor in front of him 32° and the
// bubble top 10° above, so all of it fits the 72.7° view at any tilt from -26° to +5°. index.html took the
// nearest hit (a box top 0.9 m away), where his feet-to-head alone spans 74°, so he could never fit.
const DISTS = [2.5, 2.25, 2.75, 2, 3, 1.8];
const area = (poly) => Math.abs(poly.reduce((s, p, i) => { const q = poly[(i + 1) % poly.length]; return s + p.x * q.z - q.x * p.z; }, 0)) / 2;
const inside = ({ m, poly }, x, z) => {   // seen from above; the pose is rigid, so plane-space x, z are dots with its axes
  const u = (x - m[12]) * m[0] + (z - m[14]) * m[2], v = (x - m[12]) * m[8] + (z - m[14]) * m[10];
  let k = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const a = poly[i], b = poly[j];
    if ((a.z > v) !== (b.z > v) && u < ((b.x - a.x) * (v - a.z)) / (b.z - a.z) + a.x) k = !k;
  }
  return k;
};
const pickSpot = (planes, cam, fwd) => {
  const up = planes.filter((p) => p.m[5] > 0.9), y = Math.min(...up.filter((p) => area(p.poly) > 0.25).map((p) => p.m[13]));
  if (!isFinite(y)) return null;
  const floor = up.filter((p) => p.m[13] < y + 0.05), furniture = up.filter((p) => p.m[13] > y + 0.1);
  for (const d of DISTS) {
    const x = cam.x + fwd.x * d, z = cam.z + fwd.z * d;
    if (floor.some((p) => inside(p, x, z)) && !furniture.some((p) => inside(p, x, z))) return { x, y, z };
  }
  return null;
};
// The phone's forward, levelled (its top edge when it points straight down). m is a column-major pose.
const levelForward = (m) => { let x = -m[8], z = -m[10]; if (Math.hypot(x, z) < 0.2) { x = m[4]; z = m[6]; } const l = Math.hypot(x, z); return { x: x / l, z: z / l }; };
// A floor known only by its height (from hit tests or local-floor): a huge flat plane.
const flatAt = (y) => ({ m: new THREE.Matrix4().makeTranslation(0, y, 0).elements, poly: [[-1e3, -1e3], [1e3, -1e3], [1e3, 1e3], [-1e3, 1e3]].map(([x, z]) => ({ x, z })) });

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight);
renderer.domElement.className = 'gl'; document.body.prepend(renderer.domElement);
const camera = new THREE.PerspectiveCamera(VFOV, innerWidth / innerHeight, 0.02, 60);
camera.rotation.order = 'YXZ';

if (PREVIEW) {
  // ---- Preview: a room (floor, a 0.5 m box 0.9 m ahead, a 0.45 m bed on the left), the planes ARCore
  // would detect in it, and a scripted phone, rendered one frame at a time (previewAt) ----
  start.style.display = 'none'; intro.style.display = 'none';
  const floorTex = canvasTex(512, 512, (g) => {
    for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) { g.fillStyle = (i + j) % 2 ? '#d9cfbf' : '#d2c7b5'; g.fillRect(i * 256, j * 256, 256, 256); }
    for (let n = 0; n < 900; n++) { g.fillStyle = `rgba(90,70,50,${0.04 + rand() * 0.05})`; g.fillRect(rand() * 512, rand() * 512, 2 + rand() * 5, 1 + rand() * 3); }
    g.strokeStyle = '#b3a690'; g.lineWidth = 6; g.strokeRect(0, 0, 512, 512); g.beginPath(); g.moveTo(256, 0); g.lineTo(256, 512); g.moveTo(0, 256); g.lineTo(512, 256); g.stroke();
  });
  floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping; floorTex.repeat.set(30 / 1.2, 30 / 1.2); floorTex.anisotropy = 8;
  // renderOrder -2: three.js sorts opaque meshes by material before depth, so without it the room would be
  // drawn after the ring's band and footprints (which write no depth) and hide them.
  scene.add(Object.assign(new THREE.Mesh(new THREE.PlaneGeometry(30, 30).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ map: floorTex })), { renderOrder: -2 }));
  scene.background = new THREE.Color('#ece7df');
  const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x)), rad = THREE.MathUtils.degToRad;
  // Walls (x -2.8..2.6, z -4.6..1.2) and two blocks; flat colours, so each face gets its own shade.
  const block = (w, h, d, x, y, z, [top, side, front]) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), [side, side, top, top, front, side].map((color) => new THREE.MeshBasicMaterial({ color })));
    m.position.set(x, y, z); m.renderOrder = -2; m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), new THREE.LineBasicMaterial({ color: '#7a6a58' }))); scene.add(m);
  };
  block(5.4, 2.6, 0.01, -0.1, 1.3, -4.6, ['#e6dfd3', '#e6dfd3', '#e6dfd3']); block(0.01, 2.6, 5.8, -2.8, 1.3, -1.7, ['#dcd4c6', '#dcd4c6', '#dcd4c6']);
  block(0.01, 2.6, 5.8, 2.6, 1.3, -1.7, ['#d6cebf', '#d6cebf', '#d6cebf']);
  block(0.5, 0.5, 0.5, 0.15, 0.25, -0.9, ['#d9b07c', '#a87c50', '#c49562']);   // the box
  block(1.4, 0.45, 2, -2.1, 0.225, -1.4, ['#9cbbe0', '#6f8fb8', '#86a6cf']);   // the bed
  // The planes ARCore would report in this room, as WebXR gives them: pose matrix + polygon in plane space.
  const rect = (x, y, z, w, d) => ({ m: new THREE.Matrix4().makeTranslation(x, y, z).elements,
    poly: [[-w / 2, -d / 2], [w / 2, -d / 2], [w / 2, d / 2], [-w / 2, d / 2]].map(([a, b]) => ({ x: a, y: 0, z: b })) });
  const planes = [rect(-0.1, 0, -1.7, 5, 5.4), rect(0.15, 0.5, -0.9, 0.5, 0.5), rect(-2.1, 0.45, -1.4, 1.4, 2)];   // floor, box top, bed top
  // index.html's rule: the first floor-like hit-test result for the middle of the view, which is the nearest one.
  const centreHit = () => {
    const o = camera.position, dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    let best = null;
    for (const { m, poly } of planes) {
      const k = (m[13] - o.y) / dir.y, x = o.x + dir.x * k, z = o.z + dir.z * k;
      if (k > 0 && Math.abs(x - m[12]) < poly[1].x && Math.abs(z - m[14]) < poly[2].z && (!best || k < best.k)) best = { k, x, y: m[13], z };
    }
    return best;
  };
  const TAP = 3, EYE = 1.4, look = new THREE.Vector3(), aim0 = new THREE.Vector3(), P = new THREE.Vector3();
  let placed = false;
  // 0-3 s: look down at the floor in front (the box is there), glance left at the bed and back; the planes
  // are found at 0.6 s; tap at 3 s. Then raise the phone to him, walk round him while stepping closer, step back.
  const scan = (s) => {
    const g = Math.sin(Math.PI * ease((s - 0.9) / 1.6));
    camera.position.set(0, EYE, 0); camera.rotation.set(rad(-45 + 7 * g), rad(36 * g), 0); camera.updateMatrixWorld();
  };
  window.previewAt = async (t) => {
    rig.renderAt(t);
    if (!placed) scan(Math.min(t, TAP));
    const spot = placed || t < 0.6 ? null : OLD ? centreHit() : pickSpot(planes, camera.position, levelForward(camera.matrixWorld.elements));
    if (!placed) {
      // 4 mm up: the simulated floor is a real surface here, unlike in AR.
      reticle.visible = !!spot; if (spot) reticle.matrix.makeTranslation(spot.x, spot.y + 0.004, spot.z);
      tip(spot ? 'Tap to call Nobita here' : 'Slowly look around the floor a few steps ahead');
    }
    if (!placed && t >= TAP && spot) {
      P.set(spot.x, spot.y, spot.z); placed = true; place(P.clone(), TAP);
      aim0.copy(camera.position).add(new THREE.Vector3(0, 0, -2).applyQuaternion(camera.quaternion));
    }
    if (placed) {
      const r0 = Math.hypot(P.x, P.z), phi0 = Math.atan2(-P.x, -P.z);
      const orbit = ease((t - 6.6) / 5), back = ease((t - 12.6) / 2.6), r = r0 + (1.9 - r0) * orbit + (2.6 - 1.9) * back;
      const phi = phi0 + rad(55 * orbit + 5 * back);
      camera.position.set(P.x + r * Math.sin(phi), EYE + 0.01 * Math.sin(t * 7.1), P.z + r * Math.cos(phi));
      camera.lookAt(look.lerpVectors(aim0, new THREE.Vector3(P.x, P.y + 0.7 + 0.01 * Math.sin(t * 5.3), P.z), ease((t - TAP) / 1.2)));
    }
    camera.updateMatrixWorld();
    await Promise.resolve(); await rasterise();
    update(t, camera.position);
    renderer.render(scene, camera);
  };
  // For the test: the floor picker, the ring, the phone's tilt, and where his feet, the floor in front of him and the bubble land on screen.
  window.pickSpot = pickSpot;
  window.probe = () => {
    const v = (x, y, z) => new THREE.Vector3(x, y, z), at = (p) => p.project(camera).y;
    const ring = reticle.visible ? v().setFromMatrixPosition(reticle.matrix) : null, dir = v(0, 0, -1).applyQuaternion(camera.quaternion);
    const toCam = v(camera.position.x - P.x, 0, camera.position.z - P.z).normalize();
    return { ring, cam: camera.position.clone(), pitch: THREE.MathUtils.radToDeg(Math.asin(dir.y)),
      ndc: placed ? { feet: at(P.clone()), shadowFront: at(P.clone().addScaledVector(toCam, 0.22)), head: at(v(P.x, P.y + TALL_M, P.z)), bubbleTop: at(v(P.x, P.y + TALL_M + 0.45, P.z)) } : null };
  };
} else {
  // ---- AR: ARCore through WebXR. The floor comes from detected planes; without them, from the lowest
  // floor-like hit-test result; with neither after 6 s, from local-floor (on ARCore that is a fixed 1.2 m
  // below where the phone started, so it is only a guess). His spot is then held by an anchor ------
  let hitSource = null, anchor = null, planesOn = false, localFloor = false, lowHit = Infinity, startedAt = 0;
  const t0 = performance.now() / 1000, cam = new THREE.Vector3(), here = new THREE.Vector3();
  const ok = navigator.xr && (await navigator.xr.isSessionSupported('immersive-ar').catch(() => false));
  start.textContent = ok ? 'Start AR' : 'AR is not available in this browser';
  start.disabled = !ok;
  start.onclick = async () => {
    const session = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test'], optionalFeatures: ['dom-overlay', 'anchors', 'plane-detection', 'local-floor'], domOverlay: { root: document.getElementById('overlay') },
    });
    planesOn = !!session.enabledFeatures?.includes('plane-detection'); localFloor = !!session.enabledFeatures?.includes('local-floor');
    renderer.xr.enabled = true; renderer.xr.setReferenceSpaceType(localFloor ? 'local-floor' : 'local');
    await renderer.xr.setSession(session);
    hitSource = await session.requestHitTestSource({ space: await session.requestReferenceSpace('viewer') });
    session.addEventListener('select', (e) => {
      if (placedAt !== null || !reticle.visible) return;
      const p = here.setFromMatrixPosition(reticle.matrix).clone();
      place(p, performance.now() / 1000);
      // The event's frame is only live during this call, so the anchor is asked for here.
      try { e.frame.createAnchor(new XRRigidTransform(p), renderer.xr.getReferenceSpace()).then((a) => (anchor = a), () => {}); } catch {}
    });
    session.addEventListener('end', () => location.reload());
    start.style.display = 'none'; intro.style.display = 'none';
    startedAt = performance.now() / 1000;
    tip('Slowly look around the floor a few steps ahead');
  };
  renderer.setAnimationLoop((time, xrFrame) => {
    const now = performance.now() / 1000;
    if (xrFrame && hitSource) {
      const ref = renderer.xr.getReferenceSpace(), view = xrFrame.getViewerPose(ref);
      if (view) cam.set(view.transform.position.x, view.transform.position.y, view.transform.position.z);
      if (placedAt === null && view) {
        for (const h of xrFrame.getHitTestResults(hitSource)) {   // a hit pose's Y axis is the surface normal
          const m = h.getPose(ref)?.transform.matrix;
          if (m && m[5] > 0.9) lowHit = Math.min(lowHit, m[13]);
        }
        const planes = planesOn ? [...xrFrame.detectedPlanes].map((p) => ({ m: xrFrame.getPose(p.planeSpace, ref)?.transform.matrix, poly: p.polygon })).filter((p) => p.m) : [];
        const guessed = !planes.length && lowHit === Infinity && localFloor && now - startedAt > 6;
        const spot = pickSpot(planes.length ? planes : lowHit < Infinity ? [flatAt(lowHit)] : guessed ? [flatAt(0)] : [], cam, levelForward(view.transform.matrix));
        reticle.visible = !!spot;
        if (spot) reticle.matrix.makeTranslation(spot.x, spot.y, spot.z);
        tip(!spot ? 'Slowly look around the floor a few steps ahead' : guessed ? 'Floor not found yet: tap to call Nobita anyway' : 'Tap to call Nobita here');
      }
      if (anchor && xrFrame.trackedAnchors?.has(anchor)) {
        const p = xrFrame.getPose(anchor.anchorSpace, ref);
        if (p) nobita.position.set(p.transform.position.x, p.transform.position.y, p.transform.position.z);
      }
    }
    rig.renderAt(now - t0); rasterise();
    update(now, cam);
    renderer.render(scene, camera);
  });
}
window.ready = true;
</script>
</body>
</html>
