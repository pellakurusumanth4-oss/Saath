  document.getElementById('title').style.display = 'none';
  document.getElementById('sheet').style.display = 'none';
  const street = document.getElementById('street'); street.style.display = 'block';
  const W = innerWidth, H = innerHeight, crop = [424, 0, 432, 960], f = 960, cx = 640, hy = 690, camH = 1.6, k = H / crop[3];
  const photo = document.getElementById('photo'); photo.src = P.get('photo');
  photo.style.transform = `scale(${k}) translate(${-crop[0]}px, ${-crop[1]}px)`;
  const svg = make(document.getElementById('streetChar'));
  svg.style.filter = 'saturate(0.86) brightness(0.97) contrast(0.96)';
  const bubble = document.getElementById('bubble'), hint = document.getElementById('hint');
  // A spot on the plaza: X metres right of the camera's line, d metres ahead, to photo px.
  const ground = (X, d) => [cx + f * X / d, hy + f * camH / d];
  const place = ([X, d], pose) => {
    const [u, v] = ground(X, d), px = f * 1.40 / d;                       // 1.40 m tall at d metres
    const unit = px / 483;                                                // drawing height (29..512) in units
    const x = (u - crop[0]) * k, y = (v - crop[1]) * k;
    svg.setAttribute('width', 520); svg.setAttribute('height', 600);
    svg.style.transform = `translate(${x}px, ${y}px) scale(${unit * k}) translate(-260px, -572px)`;
    svg.querySelector('.contact').setAttribute('ry', 22); svg.querySelector('.contact').setAttribute('fill', 'rgba(25,20,16,0.34)');
    apply(svg, pose);
    return [x, y - px * k];
  };
  const ringAt = ([X, d], a) => {
    let r = document.getElementById('ring');
    if (!r) { street.insertAdjacentHTML('beforeend', '<svg id="ring" style="position:absolute;left:0;top:0;overflow:visible" width="1" height="1"></svg>'); r = document.getElementById('ring'); }
    const [u, v] = ground(X, d), x = (u - crop[0]) * k, y = (v - crop[1]) * k, rx = f * 0.5 / d * k, ry = rx * camH / d;
    r.innerHTML = a > 0 ? `<ellipse cx="${x}" cy="${y}" rx="${rx * (1 + 0.08 * Math.sin(a * 6))}" ry="${ry}" fill="rgba(255,196,87,0.25)" stroke="#FFB43C" stroke-width="${3.2 * a}" opacity="${a}"/>` +
      `<ellipse cx="${x - rx * 0.22}" cy="${y}" rx="${rx * 0.12}" ry="${ry * 0.45}" fill="#FFC457" opacity="${a}"/><ellipse cx="${x + rx * 0.22}" cy="${y}" rx="${rx * 0.12}" ry="${ry * 0.45}" fill="#FFC457" opacity="${a}"/>` : '';
  };
  const gr = document.getElementById('grain'); gr.width = W; gr.height = H;
  const gc = gr.getContext('2d'), im = gc.createImageData(W, H);
  let s = 5; for (let i = 0; i < im.data.length; i += 4) { s = (s * 16807) % 2147483647; const v = 128 + ((s / 2147483647) - 0.5) * 120; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  gc.putImageData(im, 0, 0);
  const say = (head, text) => { bubble.style.display = 'block'; bubble.textContent = text;
    const bw = bubble.offsetWidth, right = head[0] + 18 + bw < W - 12;   // beside his head, whichever side has room
    bubble.style.left = (right ? head[0] + 18 : head[0] - 18 - bw) + 'px'; bubble.style.top = (head[1] - 46) + 'px';
    bubble.style.borderRadius = right ? '16px 16px 16px 4px' : '16px 16px 4px 16px'; };
  // 12.5 s: camera on, his spot lights up, he runs in late from the left (feet planted: 1.5 m/s at 3
  // steps a second), stops on the spot panting, straightens up, walks over three-quarter on (0.72 m/s
  // at 1.7 steps a second), turns to face you and says hi. Everything, his position included, on 2s.
  const S0 = [-2.7, 8.3], A = [-1.05, 7.8], B = [0.3, 6.4];
  const heading = (a, b) => Math.atan2(b[0] - a[0], a[1] - b[1]) / R;
  const RUN_V = 2 * RUN_HALF * 2 / RUN * 1.40 / 483, WALK_V = 2 * HALF_STEP * 2 / STRIDE * 1.40 / 483;   // m/s
  const RUN0 = 1.6, RUN1 = RUN0 + Math.hypot(A[0] - S0[0], A[1] - S0[1]) / RUN_V, TURN = heading(A, B), RTURN = heading(S0, A);
  const PANT1 = RUN1 + 1.9, WALK0 = PANT1 + 0.5, WALK1 = WALK0 + Math.hypot(B[0] - A[0], B[1] - A[1]) / WALK_V;
  loopLen = WALK1 + 0.25 + 4.0;
  render = (t) => {
    const ts = step(t);
    hint.style.display = t < 1.4 ? 'block' : 'none';
    bubble.style.display = 'none';
    svg.style.display = ts < RUN0 ? 'none' : '';
    ringAt(A, t >= 1.0 && t < 3.3 ? Math.min(1, (t - 1.0) / 0.3) * (t > 3.0 ? (3.3 - t) / 0.3 : 1) : 0);
    if (ts < RUN0) return;
    if (ts < RUN1) { const k2 = (ts - RUN0) / (RUN1 - RUN0); place([lerp(S0[0], A[0], k2), lerp(S0[1], A[1], k2)], run(ts - RUN0, { ...REST }, RTURN)); return; }
    if (ts < RUN1 + 0.17) {   // skids to a stop
      const p = { ...REST, turn: RTURN, lean: -6, legL: [-20, 0, 0], legR: [26, 0, -8], armL: [-50, 30, 'open'], armR: [60, -30, 'open'], eyes: 'small', mouth: 'o', sweat: 1, k: tick(ts) };
      place(A, p); return;
    }
    if (ts < PANT1) {   // hands on knees, panting
      const j = tick(ts) % 2, hp = { ...REST, turn: 18, lean: 22, bodyY: 10, armL: [-2, -38, 'relax'], armR: [16, -40, 'relax'], legL: [-6, 0, 0], legR: [8, 0, 0],
        head: -16, headY: 4, eyes: j ? 'cry' : 'shut', mouth: 'pant', sweat: 1, sy: j ? 0.985 : 1, k: tick(ts) };
      const head = place(A, hp); if (ts > RUN1 + 0.6) say(head, 'Phew… made it!'); return;
    }
    if (ts < WALK0 - 0.17) { const p = idle(ts); p.look = [0, 0]; p.armR = [150, -150, 'relax', 0]; p.front = 'R'; p.eyes = 'happy'; p.mouth = 'open'; place(A, p); return; }   // wipes his brow
    if (ts < WALK0) { const p = idle(ts); p.turn = TURN * (ts < WALK0 - 0.08 ? 0.45 : 0.8); p.look = [4, 0]; place(A, p); return; }
    if (ts < WALK1) { const k2 = (ts - WALK0) / (WALK1 - WALK0); place([lerp(A[0], B[0], k2), lerp(A[1], B[1], k2)], walk(ts - WALK0, { ...REST }, TURN)); return; }
    if (ts < WALK1 + 0.25) { const p = idle(ts), i = Math.round((ts - WALK1) * 12); p.turn = TURN * [0.7, 0.4, 0.15][Math.min(2, i)]; p.look = [3, 0]; place(B, p); return; }
    const w0 = WALK1 + 0.25, head = place(B, ts - w0 < 3.3 ? wave(ts - w0) : idle(ts));
    if (ts - w0 > 0.42 && ts - w0 < 2.9) say(head, 'Hi! I’m Nobita!');
  };
}
window.renderAt = render;
if (!P.get('capture')) { const t0 = performance.now(); (function loop() { const t = (performance.now() - t0) / 1000; render(mode === 'sheet' || mode === 'turn' ? t : t % loopLen); requestAnimationFrame(loop); })(); }
else render(0);
window.__ready = true;
</script>
</body>
</html>
