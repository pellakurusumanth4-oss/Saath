// The hand moves on an arc round the shoulder (its distance and angle blend), as an arm sweeps, not on a straight line, which

const blinkAt = (t, at) => (Math.abs(t - at) < 0.09 ? 1 : 0);

const talkAt = (t, t0, script) => { const i = Math.floor((t - t0) * 6); return i >= 0 && i < script.length ? { '-': 'closed', h: 'half', o: 'open', r: 'round' }[script[i]] : 'closed'; };

// Hi!: his right hand out of the pocket to a wave beside his head, a smile that becomes a grin, "Hi!".

// Welcome! (the Merger grin): a dip, then both arms thrown open, palms out, the biggest grin, a little bounce.

// Look to camera (the Office beat): looking off to one side, then his head and eyes turn to you, brows up a touch,
// and he holds the deadpan for a second and a half. In AR he is looking at you.
function look(t) {

// I declare bankruptcy! (Money): an inhale, then he stands square, arms down with fists, chest out, and shouts it

// Finger guns: both hands up, index fingers out and thumbs cocked, a wink and a grin, two "bang"s with a little kick.

  mystery: (on) => { mystery = !!on; svg.style.filter = on ? 'brightness(0)' : ''; svg.style.opacity = on ? '0.86' : ''; q.style.display = mystery && !quiet && at ? 'block' : 'none'; shown = ''; },
  quiet: (on) => { quiet = !!on; q.style.display = mystery && !quiet && at ? 'block' : 'none'; },
  head: () => { const r = svg.querySelector('.head').getBoundingClientRect(); return [r.left, r.top, r.width, r.height]; },
  // Stops the clock on the idle drawing at time t (for portraits).

  // Floor mode. eye: how high the phone is (m); tallM: his height (m).

  // He appears right on the ring, does his arrival there, says hi, and stays on that spot.
  floorCall: (hello) => {

  } else if (cur === R.idle && !mystery && !faceOn.mouth && !queue.length && R.extras.length && t - since >= rest && (!fl.on || fl.state === 'stay')) begin(R.extras[Math.floor(Math.random() * R.extras.length)], t);
  const loop = cur === R.idle;

addEventListener('resize', layout);
if (window.visualViewport) visualViewport.addEventListener('resize', layout);
layout();
const t0 = performance.now();
(function loop() { render((performance.now() - t0) / 1000); requestAnimationFrame(loop); })();
post({ type: 'ready' });

} else if (mode === 'one') {
  document.getElementById('title').style.display = 'none';
  const sheet = document.getElementById('sheet'); sheet.style.cssText = 'grid-template-columns:1fr;grid-template-rows:1fr;padding:10px';
  const [name, note, fn, len] = CLIPS[+P.get('clip') || 0], svg = make(document.createElementNS('http://www.w3.org/2000/svg', 'svg'));
  const cell = document.createElement('div'); cell.className = 'cell'; cell.appendChild(svg); cell.insertAdjacentHTML('beforeend', `<b>${name}</b><span>${note}</span>`); sheet.appendChild(cell);
  svg.style.height = '92vh'; loopLen = len;
  render = (t) => apply(svg, fn(step(t % len)));
} else if (mode === 'pose') {
  // One drawing for overlays: #mode=pose&p={json} (pose fields over REST)
  document.getElementById('title').style.display = 'none'; document.getElementById('sheet').style.display = 'none';
  const svg = make(document.createElementNS('http://www.w3.org/2000/svg', 'svg')); svg.id = 'pose';
  svg.style.cssText = 'position:absolute;left:0;top:0;width:100vw;height:100vh;overflow:visible'; document.body.appendChild(svg);

} else if (mode === 'trace') {
  // The rig over a still: #mode=trace&ref=<image>&k=<px per mm>&ox&oy=<image px of the rig's origin>&z=<zoom>&lines=1&p={pose}
  document.getElementById('title').style.display = 'none'; document.getElementById('sheet').style.display = 'none';
  const k = +P.get('k'), ox = +P.get('ox'), oy = +P.get('oy'), z = +P.get('z') || 1, img = new Image();
  const svg = make(document.createElementNS('http://www.w3.org/2000/svg', 'svg'));
  if (P.get('lines')) { svg.classList.add('lines'); document.head.insertAdjacentHTML('beforeend', `<style>.lines *{fill:none!important;stroke:#ff00ff!important;stroke-width:${(1.4 / (k * z)).toFixed(2)}px!important;opacity:1!important}.lines clipPath,.lines text{display:none}</style>`); }

  const svgs = CLIPS.map(([name, note]) => {

    const svg = make(document.createElementNS('http://www.w3.org/2000/svg', 'svg')); cell.appendChild(svg);
    cell.insertAdjacentHTML('beforeend', `<b>${name}</b><span>${note}</span>`); sheet.appendChild(cell); return svg;

if (mode === 'trace') {}   // ready once the still has loaded
else if (!P.get('capture')) { const t0 = performance.now(); (function loop() { const t = (performance.now() - t0) / 1000; render(t % loopLen); requestAnimationFrame(loop); })(); }
else render(0);
if (mode !== 'trace') window.__ready = true;

</script>
