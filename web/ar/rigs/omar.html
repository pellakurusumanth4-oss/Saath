<body>
<div class="title" id="title">OMAR · SAATH BUSINESS MASCOT · 2D RIG</div>
<div class="sheet" id="sheet"></div>
<script>window.SAATH_AR = {"ground":[0,0],"tall":172,"roles":{"idle":"Idle","hi":"Hi!","arrive":"Welcome!","extras":["Show","Think","Laugh"]},"mouths":{"closed":"closed","half":"half","open":"open","round":"round","wide":"wide"},"moods":{"neutral":{},"happy":{"eyes":"happy"},"excited":{"eyes":"happy","brows":"up","closed":"grin"},"surprised":{"brows":"up","closed":"round"},"curious":{"look":[1,0],"brows":"tilt"},"sad":{"brows":"sad","closed":"flat"},"worried":{"brows":"sad","look":[0,0.6],"closed":"flat"},"sleepy":{"blink":0.55},"thinking":{"look":[1,-1],"brows":"tilt"}},"actions":{"wave":"Hi!","welcome":"Welcome!","show":"Show","yes":"Yes!","think":"Think","laugh":"Laugh"},"later":[]};</script>
<script>
// Saath business mascots: one parametric drawer on two skeletons (adult, young), flat fills with ink under fill.
// Units are cm, y down, ground at y = 0, figure centred on x = 0. Each part is its own <g id> (legs, torso, arms, head, hair,
// face, prop) so a rig builder can lift them one by one.
const INK = '#2B2433';
const SKIN = { s1: ['#FFE3CC', '#F2C6A6'], s2: ['#F8CFA9', '#E6B086'], s3: ['#DDA678', '#C58A5E'], s4: ['#B57B52', '#98623E'], s5: ['#7C4B33', '#633A27'] };
const f = (n) => +n.toFixed(2);
const pt = (p) => `${f(p[0])},${f(p[1])}`;

// One group whose shapes share one outline: every shape stroked in ink first, then every fill on top.
function inked(id, shapes, sw = 1.0) {
  const ink = shapes.filter((s) => !s.noInk).map((s) => s.circle ? `<circle cx="${f(s.circle[0])}" cy="${f(s.circle[1])}" r="${f(s.circle[2])}"/>` : `<path d="${s.d}"${s.rule ? ` fill-rule="${s.rule}"` : ''}/>`).join('');
  const fill = shapes.map((s) => s.circle ? `<circle cx="${f(s.circle[0])}" cy="${f(s.circle[1])}" r="${f(s.circle[2])}" fill="${s.fill}"/>` : `<path d="${s.d}" fill="${s.fill}"${s.rule ? ` fill-rule="${s.rule}"` : ''}/>`).join('');
  return `<g id="${id}"><g fill="${INK}" stroke="${INK}" stroke-width="${sw * 2}" stroke-linejoin="round">${ink}</g>${fill}</g>`;
}
const line = (d, w = 0.8, c = INK, extra = '') => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"${extra}/>`;

// Tapered segment A->B (widths wa, wb) as a quad; joints become circles in the same inked group.
function seg(A, B, wa, wb) {
  const dx = B[0] - A[0], dy = B[1] - A[1], l = Math.hypot(dx, dy) || 1, nx = -dy / l, ny = dx / l;
  return `M${pt([A[0] + nx * wa / 2, A[1] + ny * wa / 2])}L${pt([B[0] + nx * wb / 2, B[1] + ny * wb / 2])}L${pt([B[0] - nx * wb / 2, B[1] - ny * wb / 2])}L${pt([A[0] - nx * wa / 2, A[1] - ny * wa / 2])}Z`;
}
function limb(pts, ws, fill, endCap = true) {
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) out.push({ d: seg(pts[i], pts[i + 1], ws[i], ws[i + 1]), fill });
  pts.forEach((p, i) => { if (endCap || i < pts.length - 1) out.push({ circle: [p[0], p[1], ws[i] / 2], fill }); });
  return out;
}
const lerp = (A, B, t) => [A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t];
const unit = (A, B) => { const l = Math.hypot(B[0] - A[0], B[1] - A[1]) || 1; return [(B[0] - A[0]) / l, (B[1] - A[1]) / l]; };

// Skeletons. Adult: 172 cm, head 40 (4.3 heads). Young: 140 cm, head 42 (3.3 heads).
const BASES = {
  adult: { H: 172, h: 40, sy: -124, wy: -90, hy: -76, crotch: -80, knee: -42, ankle: -6, hipX: 7.2, legW: [15.6, 11.6, 10.2], arm: [9.2, 7.6, 6.2], hand: 3.7, upper: 24, fore: 22 },
  young: { H: 140, h: 42, sy: -93, wy: -70, hy: -60, crotch: -60, knee: -30, ankle: -5, hipX: 6.4, legW: [13.4, 10.2, 9.2], arm: [8, 6.8, 5.6], hand: 3.3, upper: 17, fore: 16 },
};

// Arm poses: elbow and wrist from the shoulder pivot, as angles in degrees from straight down (positive = outward).
const POSES = { rest: [12, 6], raise: [24, 168], wave: [32, 150], hang: [14, 4], hip: [40, -40], hold: [18, 95] };
function armJoints(b, side, pose, sw) {
  const P = [side * (sw - 3), b.sy + 3];
  const [a1, a2] = POSES[pose], r = (d) => d * Math.PI / 180;
  const E = [P[0] + side * Math.sin(r(a1)) * b.upper, P[1] + Math.cos(r(a1)) * b.upper];
  const W = [E[0] + side * Math.sin(r(a2)) * b.fore, E[1] + Math.cos(r(a2)) * b.fore];
  return { P, E, W };
}

function hand(W, dir, b, skin, kind, side) {
  const r = b.hand, C = [W[0] + dir[0] * r * 0.9, W[1] + dir[1] * r * 0.9];
  if (kind === 'open') {
    // an anime mitten: palm and fingers as one rounded block, a thumb on the inner side; finger gaps are lines (handLines)
    const u = dir, v = [-dir[1], dir[0]], at = (a, b2) => [W[0] + u[0] * a * r + v[0] * b2 * r, W[1] + u[1] * a * r + v[1] * b2 * r];
    const d = `M${pt(at(0.1, -0.95))}L${pt(at(1.9, -1.05))}C${pt(at(3.05, -1.05))} ${pt(at(3.05, 1.05))} ${pt(at(1.9, 1.05))}L${pt(at(0.1, 0.95))}C${pt(at(-0.5, 0.95))} ${pt(at(-0.5, -0.95))} ${pt(at(0.1, -0.95))}Z`;
    const ti = -side, t0 = at(0.6, ti * 0.7), t1 = at(1.5, ti * 1.75);
    return [{ d, fill: skin }, ...limb([t0, t1], [r * 0.75, r * 0.6], skin)];
  }
  // fist: a rounded palm plus a thumb on the side facing the body
  return [{ circle: [C[0], C[1], r], fill: skin }, { circle: [C[0] - side * r * 0.75, C[1] - r * 0.15, r * 0.5], fill: skin }];
}

function arm(b, c, side, pose, sw) {
  const { P, E, W } = armJoints(b, side, pose, sw), skin = SKIN[c.skin][0];
  const sl = c.sleeve; // 'long' | 'short' | 'rolled' | 'none'
  const bare = limb([P, E, W], b.arm, skin);
  const dir = unit(E, W);
  const open = pose === 'wave';
  const handShapes = hand(W, dir, b, skin, open ? 'open' : 'fist', side);
  let sleeve = [];
  const sc = c.sleeveColor || c.top;
  const sw2 = b.arm.map((w) => w + 2.6);
  if (sl === 'long') sleeve = limb([P, E, lerp(E, W, 0.86)], [sw2[0] + 1, sw2[1], sw2[2] + 0.4], sc, false);
  else if (sl === 'rolled') sleeve = [...limb([P, E, lerp(E, W, 0.18)], [sw2[0] + 1, sw2[1] + 0.6, sw2[1] + 1.4], sc, false)];
  else if (sl === 'short') sleeve = limb([P, lerp(P, E, 0.5)], [sw2[0] + 0.6, sw2[0] + 0.2], sc, false);
  let out = inked(`arm-${side < 0 ? 'R' : 'L'}`, [...bare, ...handShapes]);
  if (sleeve.length) out += inked(`sleeve-${side < 0 ? 'R' : 'L'}`, sleeve);
  if (sl === 'rolled') { const a = lerp(E, W, 0.18), n = [-dir[1], dir[0]]; out += line(`M${pt([a[0] + n[0] * 5, a[1] + n[1] * 5])}L${pt([a[0] - n[0] * 5, a[1] - n[1] * 5])}`, 0.7); }
  if (sl === 'long' && c.cuff) { const a = lerp(E, W, 0.76), n = [-dir[1], dir[0]]; out += line(`M${pt([a[0] + n[0] * 4.6, a[1] + n[1] * 4.6])}L${pt([a[0] - n[0] * 4.6, a[1] - n[1] * 4.6])}`, 0.7); }
  if (open) { const u = dir, v = [-dir[1], dir[0]], r = b.hand, at = (a, b2) => pt([W[0] + u[0] * a * r + v[0] * b2 * r, W[1] + u[1] * a * r + v[1] * b2 * r]);
    out += line(`M${at(1.7, -0.36)}L${at(2.75, -0.4)}M${at(1.7, 0.33)}L${at(2.75, 0.36)}`, 0.5); }
  if (!open) { const C = [W[0] + dir[0] * b.hand * 0.9, W[1] + dir[1] * b.hand * 0.9]; out += line(`M${pt([C[0] - side * 0.6, C[1] - 1.6])}q${f(side * 1.2)},1.4 0,3`, 0.5); }
  return { svg: out, W, dir, E };
}

function legs(b, c) {
  const tr = c.bottomColor, skin = SKIN[c.skin][0], H = (s) => [s * b.hipX, b.crotch - 4], K = (s) => [s * (b.hipX + 0.4), b.knee], A = (s) => [s * (b.hipX + 0.8), b.ankle];
  let parts = [], over = '';
  if (c.bottom === 'trousers') {
    parts = [{ d: `M${-b.hipX - 6.6},${b.wy}L${b.hipX + 6.6},${b.wy}L${b.hipX + 7},${b.crotch - 2}L${-b.hipX - 7},${b.crotch - 2}Z`, fill: tr },
      ...limb([H(-1), K(-1), A(-1)], b.legW, tr), ...limb([H(1), K(1), A(1)], b.legW, tr)];
    over = line(`M0,${b.crotch - 1}L0,${b.crotch + 3}`, 0.6);
  } else if (c.bottom === 'shorts' || c.bottom === 'skirt') {
    const skinLegs = [...limb([H(-1), K(-1), A(-1)], b.legW.map((w) => w - 3.2), skin), ...limb([H(1), K(1), A(1)], b.legW.map((w) => w - 3.2), skin)];
    const top = inked('legs-skin', skinLegs);
    const hemY = c.bottom === 'skirt' ? b.knee - 4 : (b.crotch + b.knee) / 2 + 2;
    const flare = c.bottom === 'skirt' ? 9 : 2.5;
    const shape = c.bottom === 'skirt'
      ? [{ d: `M${-b.hipX - 6.4},${b.wy}L${b.hipX + 6.4},${b.wy}L${b.hipX + 6.6 + flare},${hemY}Q0,${hemY + 3} ${-b.hipX - 6.6 - flare},${hemY}Z`, fill: tr }]
      : [{ d: `M${-b.hipX - 6.4},${b.wy}L${b.hipX + 6.4},${b.wy}L${b.hipX + 6.6 + flare},${hemY}L1,${hemY}L0,${b.crotch}L-1,${hemY}L${-b.hipX - 6.6 - flare},${hemY}Z`, fill: tr }];
    const socks = c.socks ? inked('socks', [...limb([[-(b.hipX + 0.8), b.ankle - 7], A(-1)], [b.legW[2] - 2.4, b.legW[2] - 2.2], c.socks), ...limb([[b.hipX + 0.8, b.ankle - 7], A(1)], [b.legW[2] - 2.4, b.legW[2] - 2.2], c.socks)]) : '';
    return `<g id="legs">${top}${socks}${inked('bottom', shape)}${shoes(b, c)}</g>`;
  }
  return `<g id="legs">${inked('trousers', parts)}${over}${shoes(b, c)}</g>`;
}
function shoes(b, c) {
  const s = (side) => { const x = side * (b.hipX + 1.8), y = b.ankle; return { d: `M${x - 6.2},${y + 5}C${x - 6.6},${y - 2.2} ${x + 6.6},${y - 2.2} ${x + 6.4 + side * 1.4},${y + 5}Q${x + side * 0.6},${y + 6.8} ${x - 6.2},${y + 5}Z`, fill: c.shoes }; };
  return inked('shoes', [s(-1), s(1)]) + line(`M${-(b.hipX + 1.6) - 4.4},${b.ankle + 3.9}L${-(b.hipX + 1.6) + 4.9},${b.ankle + 3.9}M${b.hipX + 1.6 - 4.4},${b.ankle + 3.9}L${b.hipX + 1.6 + 5.9},${b.ankle + 3.9}`, 0.45, '#FFFFFF', ' opacity="0.55"');
}

function torso(b, c, sw) {
  const sy = b.sy, ww = c.belly ? sw - 1 : sw - (c.fem ? 6.5 : 4.5), hw = c.belly ? sw - 2.5 : sw - (c.fem ? 4 : 4.8), hy = c.hem ?? b.hy;
  const d = `M-5,${sy - 3}Q${-sw + 1},${sy - 2.5} ${-sw},${sy + 3}L${-ww},${b.wy}${c.belly ? `Q${-ww - 3},${(b.wy + hy) / 2} ${-hw},${hy}` : `L${-hw},${hy}`}Q0,${hy + 1.6} ${hw},${hy}${c.belly ? `Q${ww + 3},${(b.wy + hy) / 2} ${ww},${b.wy}` : `L${ww},${b.wy}`}L${sw},${sy + 3}Q${sw - 1},${sy - 2.5} 5,${sy - 3}Z`;
  return { d, ww, hw, hy };
}

// Head in its own frame: chin at (0,0), top of skull at (0,-40), half width 19 (the young head is the same drawing scaled).
const HEAD = 'M-19,-22C-19,-46 19,-46 19,-22C19,-10 8.5,-0.8 0,0C-8.5,-0.8 -19,-10 -19,-22Z';
function face(c) {
  const iris = c.iris || '#5A3A2A';
  let s = '';
  // blush
  s += `<ellipse cx="-12.2" cy="-10.6" rx="3.4" ry="1.7" fill="#FF7F86" opacity="0.32"/><ellipse cx="12.2" cy="-10.6" rx="3.4" ry="1.7" fill="#FF7F86" opacity="0.32"/>`;
  for (const side of [-1, 1]) {
    const x = side * 8, kind = c.eyes === 'wink' ? (side < 0 ? 'happy' : 'round') : (c.eyes || 'round');
    if (kind === 'happy') { s += line(`M${x - 3.2},-16Q${x},-20.6 ${x + 3.2},-16`, 1.25); continue; }
    const ry = kind === 'almond' ? 3.6 : kind === 'calm' ? 3.3 : 4.15, cy = kind === 'calm' ? -15.9 : -16.6;
    s += `<ellipse cx="${x}" cy="${cy}" rx="3.05" ry="${ry}" fill="#FFFFFF"/>`;
    s += `<ellipse cx="${x + side * 0.2}" cy="${cy + 0.5}" rx="2.55" ry="${ry - 0.55}" fill="${iris}"/>`;
    s += `<ellipse cx="${x + side * 0.2}" cy="${cy + 1}" rx="1.35" ry="${ry * 0.48}" fill="${INK}"/>`;
    s += `<circle cx="${x - 0.9}" cy="${cy - 1.2}" r="1.05" fill="#FFFFFF"/><circle cx="${x + 1.0}" cy="${cy + 2.2}" r="0.45" fill="#FFFFFF"/>`;
    // upper lash: thick lid line with a flick at the outer corner (calm: a heavier, lower lid)
    const top = cy - ry - 0.6;
    if (kind === 'calm') s += `<path d="M${x - 3.6},${cy - 1.2}Q${x},${top - 0.8} ${x + 3.6},${cy - 1.2}L${x + 3.6},${top - 2}L${x - 3.6},${top - 2}Z" fill="${SKIN[c.skin][0]}"/>` + line(`M${x - side * 3.5},${cy - 0.6}Q${x - side * 1},${cy - 2.6} ${x + side * 3.8},${cy - 1.4}`, 1.2);
    else s += line(`M${x - side * 3.4},${cy - 0.8}Q${x - side * 2.4},${top} ${x + side * 1.2},${top + 0.4}Q${x + side * 3.2},${top + 1} ${x + side * 3.9},${cy - 2}`, 1.15);
    if (c.fem) s += line(`M${x + side * 3.5},${cy - 2.7}l${side * 1.5},-1.1`, 0.8) + (kind === 'almond' ? line(`M${x + side * 3.6},${cy - 1.6}l${side * 1.6},-0.2`, 0.7) : '');
  }
  if (c.freckles) s += [[-12, -11.4], [-10.4, -10.4], [-13.4, -10], [12, -11.4], [10.4, -10.4], [13.4, -10]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="0.42" fill="#C0703F"/>`).join('');
  // brows
  const by = c.brow ?? -25;
  s += line(`M-11,${by + 0.6}Q-8,${by - 1.2} -5,${by + 0.2}`, c.thickBrow ? 1.6 : 1.2, c.browColor || INK);
  s += line(`M11,${by + 0.6}Q8,${by - 1.2} 5,${by + 0.2}`, c.thickBrow ? 1.6 : 1.2, c.browColor || INK);
  // nose: a small shade tick
  s += line('M0.4,-11.6l-0.8,1.2l0.9,0.3', 0.6, SKIN[c.skin][1]);
  // mouth
  if (c.mouth === 'grin') s += line('M-3.4,-6.4Q0,-3.6 3.4,-6.4', 0.9);
  else if (c.mouth === 'smirk') s += line('M-3.2,-5.6Q0.6,-3.8 3.6,-7', 0.9) + line('M3.2,-7.4l0.9,0.9', 0.6);
  else if (c.mouth === 'small') s += `<path d="M-2.4,-6.2Q0,-5.8 2.4,-6.2Q1.6,-3.6 0,-3.6Q-1.6,-3.6 -2.4,-6.2Z" fill="#8A2E3B" stroke="${INK}" stroke-width="0.6" stroke-linejoin="round"/>`;
  else if (c.mouth === 'big') s += `<path d="M-4.6,-7Q0,-6.4 4.6,-7Q3.6,-1.4 0,-1.4Q-3.6,-1.4 -4.6,-7Z" fill="#8A2E3B" stroke="${INK}" stroke-width="0.7" stroke-linejoin="round"/><path d="M-4,-6.8Q0,-6.3 4,-6.8L3.7,-5.6Q0,-5.2 -3.7,-5.6Z" fill="#FFFFFF"/><path d="M-2.4,-2.4Q0,-4.2 2.4,-2.4Q1.2,-1.6 0,-1.6Q-1.2,-1.6 -2.4,-2.4Z" fill="#F07A7A"/>`;
  else s += `<path d="M-3.8,-6.6Q0,-6.1 3.8,-6.6Q2.8,-2.2 0,-2.2Q-2.8,-2.2 -3.8,-6.6Z" fill="#8A2E3B" stroke="${INK}" stroke-width="0.7" stroke-linejoin="round"/><path d="M-2,-3.1Q0,-4.6 2,-3.1Q1,-2.4 0,-2.4Q-1,-2.4 -2,-3.1Z" fill="#F07A7A"/>`;
  return `<g id="face">${s}</g>`;
}

const HAIR = {
  // Each returns { back, front } path data in the head frame.
  rosa: () => ({ back: 'M-17,-12C-23,-14 -22,-4 -16,-6Z', front: 'M-20.5,-17C-22,-47 22,-47 20.5,-17L18.5,-21C16,-29 6,-31 -1,-27C-6,-31 -14,-29 -18.5,-21Z' }),
  kiran: () => ({ back: '', front: 'M-20.5,-17C-23,-44 -12,-50 -2,-50C6,-55 22,-53 24,-41C25,-33 22,-24 21,-17L18.5,-22C18,-29 14,-32 9,-30C6,-35 0,-36 -5,-31C-9,-34 -15,-30 -18.5,-21Z' }),
  juno: () => ({ back: 'M8,-38C22,-46 33,-36 30,-18C28,-8 34,-2 36,2C28,0 22,-8 22,-18C22,-28 16,-34 8,-34Z', front: 'M-20.5,-16C-22,-47 22,-47 20.5,-16L18.5,-20L16,-24L13,-21.5L10,-26L6.5,-22.5L3,-27L-0.5,-23L-4,-27L-7.5,-22.5L-11,-26L-14,-21.5L-17,-24L-18.5,-19Z' }),
  otto: () => ({ back: '', front: 'M-19.4,-12.6C-22.4,-15 -20.6,-18 -22.4,-21C-20.4,-22 -21.6,-26 -18.6,-28.4C-18.2,-24 -17.6,-20 -17.2,-16Z M19.4,-12.6C22.4,-15 20.6,-18 22.4,-21C20.4,-22 21.6,-26 18.6,-28.4C18.2,-24 17.6,-20 17.2,-16Z' }),
  sunny: () => ({ back: '', front: 'M-20.5,-18C-21,-34 -17,-42 -14,-44L-12,-50L-8,-45L-4,-53L0,-46L5,-54L8,-46L13,-51L14,-44C18,-41 21,-34 20.5,-18L18,-24C10,-29 -10,-29 -18,-24Z' }),
  nia: () => ({ back: 'M-21,-26C-30,-30 -30,-44 -22,-48C-22,-58 -10,-62 -3,-57C3,-63 16,-61 18,-52C27,-52 30,-40 23,-33C26,-28 24,-22 21,-21Z', front: 'M-20.5,-18C-22,-46 22,-46 20.5,-18L18.6,-22C16,-27 14,-26 12,-28C10,-26 7,-28 5,-29C3,-27 0,-29 -2,-29C-4,-27 -7,-29 -9,-28C-11,-26 -14,-27 -16,-26C-17,-24 -18,-23 -18.6,-21Z' }),

function headGroup(c, b, chinY) {
  const s = b.h / 40, skin = SKIN[c.skin], hair = HAIR[c.id]();
  let g = '';
  if (hair.back) g += inked('hair-back', [{ d: hair.back, fill: c.hairBackColor || c.hairColor }]);
  // ears, head
  g += inked('head', [{ d: 'M-18,-24C-23,-26 -23.5,-14 -17.5,-12Z', fill: skin[0] }, { d: 'M18,-24C23,-26 23.5,-14 17.5,-12Z', fill: skin[0] }, { d: HEAD, fill: skin[0] }]);
  // jaw shade under the hair line
  g += face(c);
  if (c.beard) g += inked('beard', [{ d: 'M-18.6,-20C-18,-8 -9,-0.6 0,0C9,-0.6 18,-8 18.6,-20C17,-12 12,-6 7,-5.4C4,-8.4 -4,-8.4 -7,-5.4C-12,-6 -17,-12 -18.6,-20Z', fill: c.hairColor }], 0.8) + `<path d="M-3.8,-6.6Q0,-6.1 3.8,-6.6Q2.8,-3 0,-3Q-2.8,-3 -3.8,-6.6Z" fill="#8A2E3B" stroke="${INK}" stroke-width="0.6"/>`;
  if (c.mustache) g += inked('mustache', [{ d: 'M0,-8.6C-3,-11 -8,-10.4 -9,-7.4C-6,-8.6 -3,-7.6 0,-7.2C3,-7.6 6,-8.6 9,-7.4C8,-10.4 3,-11 0,-8.6Z', fill: c.hairColor }], 0.6);
  if (hair.front) g += inked('hair', [{ d: hair.front, fill: c.hairColor, rule: c.id === 'sana' ? 'evenodd' : undefined }]);
  if (c.streak) g += `<path d="${c.streak}" fill="${c.streakColor}"/>`;
  if (c.greyTemples) g += `<path d="M-19.8,-18L-18.6,-22C-18.4,-24 -18,-25 -17.6,-26L-19.6,-25Z M19.8,-18L18.6,-23C18.4,-24.5 18.2,-25.5 17.8,-26.5L19.7,-25Z" fill="#C9C6CF"/>`;
  if (c.hairShine) g += line(c.hairShine, 1.0, '#FFFFFF', ' opacity="0.35"');
  if (c.glasses) g += `<g id="glasses" fill="none" stroke="${c.glasses}" stroke-width="1.3"><circle cx="-8.2" cy="-16.4" r="6.3"/><circle cx="8.2" cy="-16.4" r="6.3"/><path d="M-1.9,-17.2Q0,-18.6 1.9,-17.2"/></g>`;
  if (c.hat) g += HATS[c.hat](c);

  return `<g id="head-${c.id}" transform="translate(0,${f(chinY)}) scale(${f(s)})">${g}</g>`;
}

function figure(c) {
  const b = BASES[c.base], sw = c.sw ?? (c.base === 'young' ? 16 : c.fem ? 18.5 : 21);
  const t = torso(b, c, sw);
  const chinY = b.sy - (c.base === 'young' ? 4.5 : 7);
  const [lp, rp] = c.pose; // screen-left arm, screen-right arm
  const L = arm(b, c, -1, lp, sw), R = arm(b, c, 1, rp, sw);
  const handC = (A) => [A.W[0] + A.dir[0] * b.hand * 0.9, A.W[1] + A.dir[1] * b.hand * 0.9];
  const skin = SKIN[c.skin];
  let s = `<ellipse cx="0" cy="1.2" rx="${sw + 6}" ry="3.4" fill="#2B2433" opacity="0.12"/>`;
  s += legs(b, c);
  { const hu = HAIR[c.id]().under; if (hu) s += `<g transform="translate(0,${f(chinY)}) scale(${f(b.h / 40)})">${inked('hair-under', [{ d: hu, fill: c.hairColor }])}</g>`; }
  s += inked('neck', [{ d: `M-4.6,${chinY - 4}L4.6,${chinY - 4}L5,${b.sy}L-5,${b.sy}Z`, fill: skin[1] }], 0.8);
  s += `<g id="torso">${inked('top', [{ d: t.d, fill: c.top }])}${c.details.map((k) => DETAILS[k](b, c, t, sw)).join('')}</g>`;
  if (c.flour) s += `<g id="flour" fill="#FFFFFF" opacity="0.85"><ellipse cx="4.6" cy="${b.wy + 9}" rx="2.6" ry="2.2"/>${[[-1.6, -3.6], [0.4, -4.4], [2.4, -4.2], [4.2, -3.2]].map(([x, y]) => `<ellipse cx="${4.6 + x * 0.9}" cy="${b.wy + 9 + y}" rx="0.7" ry="1.3"/>`).join('')}<ellipse cx="7.6" cy="${b.wy + 9.4}" rx="0.7" ry="1.2" transform="rotate(-40 7.6 ${b.wy + 9.4})"/><circle cx="-5" cy="${b.wy + 16}" r="0.8"/><circle cx="-3" cy="${b.wy + 18}" r="0.5"/></g>`;
  if (c.tape) s += line(`M-8,${b.sy - 2}C-7,${b.sy + 10} -9,${b.sy + 18} -8,${b.sy + 26}M8,${b.sy - 2}C7,${b.sy + 10} 9,${b.sy + 18} 8,${b.sy + 22}`, 2.2, '#F2D14B') + line(`M-8,${b.sy - 2}C-7,${b.sy + 10} -9,${b.sy + 18} -8,${b.sy + 26}M8,${b.sy - 2}C7,${b.sy + 10} 9,${b.sy + 18} 8,${b.sy + 22}`, 0.4, INK, ' stroke-dasharray="0.5 1.5"');
  if (c.headphones) s += inked('headphones', [{ d: `M-11,${b.sy - 3}Q0,${b.sy + 6} 11,${b.sy - 3}L11,${b.sy - 0.6}Q0,${b.sy + 8.6} -11,${b.sy - 0.6}Z`, fill: '#22223B' }, { circle: [-11, b.sy - 1.6, 3.6], fill: c.accent }, { circle: [11, b.sy - 1.6, 3.6], fill: c.accent }], 0.7);
  s += headGroup(c, b, chinY);
  // props held below the hand go behind the arm, raised ones in front of it
  const propL = c.props[0] ? PROPS[c.props[0]](handC(L)) : '', propR = c.props[1] ? PROPS[c.props[1]](handC(R)) : '';
  s += `<g id="prop-back">${['hang', 'rest'].includes(lp) ? propL : ''}${['hang', 'rest'].includes(rp) ? propR : ''}</g>`;
  s += `<g id="arms">${L.svg}${R.svg}</g>`;
  s += `<g id="prop">${['hang', 'rest'].includes(lp) ? '' : propL}${['hang', 'rest'].includes(rp) ? '' : propR}</g>`;
  return s;
}

// Face-only drawing (for pins and cards): the head with hat, centred on the face.
function headOnly(c) {
  const b = { ...BASES.adult, h: 40 }, hu = HAIR[c.id]().under;
  return (hu ? inked('hair-under', [{ d: hu, fill: c.hairColor }]) : '') + headGroup(c, b, 0);
}
