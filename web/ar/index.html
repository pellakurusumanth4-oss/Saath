<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saath AR camera</title>
<!--
  Saath's AR camera: a friend standing on your real floor, tracked by ARCore through Chrome's WebXR.
  The app opens it in Chrome at a friend's spot: ?friend=doraemon|nobita|shinchan|goku|michael|dwight|holt
  &name=&tall=(metres)&return=<a deep link back into the app>.
  - you choose their spot: a gold ring sits where the middle of the screen meets the floor (ARCore's hit
    test), 1.2-5 m away, and a tap calls them there (18 Oct: the automatic spot took over a minute in a
    cluttered room); they are anchored there; within 1 m the view greys and asks you to step back;
  - you only hear them talk: no words on screen (18 Oct);
  - a tight contact shadow plus a soft one away from the room's main light, and the room's light dims
    them gently (no colour cast). No occlusion: on the S24 ARCore's coarse depth of the floor around
    their feet hid their feet and legs in open floor (17 Oct), so they are always drawn whole.
  Serve web/ (node web/serve.mjs), then adb reverse tcp:8099 tcp:8099 for the phone. ?preview plays a
  scripted room; ?debug shows distances; ?gain= scales the light. Rig pages come from scripts/build-rigs.mjs.
-->
<style>
  :root { --ink: #111318; --gold: #FFC83D; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111318; color: #fff; font-family: system-ui, Roboto, sans-serif; }
  canvas.gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #rig { position: fixed; left: 0; top: 0; width: 400px; height: 900px; border: 0; opacity: 0; pointer-events: none; z-index: -1; }
  #intro { position: fixed; left: 16px; right: 16px; top: 28%; text-align: center; font-weight: 700; font-size: 18px; line-height: 1.45; }
  #start { position: fixed; left: 16px; right: 16px; bottom: 36px; padding: 18px; border: 2.5px solid var(--ink); border-radius: 18px;
           background: var(--gold); box-shadow: 3px 3px 0 var(--ink); color: var(--ink); font: 900 20px system-ui, Roboto, sans-serif; }
  #overlay { position: fixed; inset: 0; pointer-events: none; transition: background .25s; }
  #overlay.close { background: rgba(70, 70, 70, .45); }   /* too close: the view greys, as in Pokémon GO AR+ */
  #overlay.close #tip, #overlay.talk.close #tip { bottom: 46%; }   /* .talk.close outranks the .talk rule below */
  /* 96px up: Chrome's "to exit full screen" banner covers the bottom ~80px for a few seconds after AR starts, which hid
     "Tap to bring…" on the S24 (18 Oct) just as the first ring showed. */
  #tip { position: absolute; left: 16px; right: 16px; bottom: 96px; padding: 14px 16px; border-radius: 18px; background: #fff; color: var(--ink);
         border: 2.5px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); font-weight: 800; font-size: 17px; text-align: center; display: none; }
  #hud { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); padding: 5px 12px; border-radius: 99px; white-space: nowrap;
         background: rgba(17, 19, 24, .62); color: #fff; font: 700 13px system-ui, Roboto, sans-serif; }
  #hud:empty { display: none; }
  #home { position: fixed; left: 16px; right: 16px; bottom: 112px; display: none; text-align: center; color: #fff; font: 800 17px system-ui, Roboto, sans-serif; }
  #back { position: absolute; right: 16px; top: 16px; display: none; padding: 10px 14px; border-radius: 99px; border: 2.5px solid var(--ink); background: #fff;
          color: var(--ink); box-shadow: 2px 2px 0 var(--ink); font: 800 15px system-ui, Roboto, sans-serif; text-decoration: none; pointer-events: auto; }
  /* Talking, kept clean (the user, 18 Oct): you hear his words, and nobody's are shown. Only the approved Golden
     Hour mic (gold; blue and pulsing while it listens), a hint or what went wrong, and the credit. */
  #overlay.talk #tip { bottom: 180px; }
  #talk { position: absolute; left: 16px; right: 16px; bottom: 22px; display: flex; flex-direction: column; align-items: center; }
  #talk[hidden] { display: none; }
  #mic { width: 84px; height: 84px; border-radius: 50%; border: 0; padding: 0; display: grid; place-items: center; color: #3B2606;
         background: linear-gradient(#FFC860, #F0A22E); box-shadow: 0 10px 24px rgba(240, 162, 46, .4), inset 0 1px 0 rgba(255, 255, 255, .55);
         touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; pointer-events: auto; }
  #mic.on { color: #fff; background: linear-gradient(#4DA3FF, #2F8DF6); animation: listen 1.2s ease-out infinite; }
  @keyframes listen { from { box-shadow: 0 0 0 0 rgba(47, 141, 246, .4), 0 10px 24px rgba(47, 141, 246, .35); }
                      to { box-shadow: 0 0 0 26px rgba(47, 141, 246, 0), 0 10px 24px rgba(47, 141, 246, .35); } }
  #hint { margin-top: 10px; font-size: 13px; font-weight: 700; text-align: center; text-shadow: 0 1px 3px rgba(0, 0, 0, .75); }
  #credit { margin-top: 6px; font-size: 10.5px; font-weight: 600; opacity: .85; text-shadow: 0 1px 2px rgba(0, 0, 0, .7); }
</style>
</head>
<body>
<iframe id="rig" title="Your friend's drawing" aria-hidden="true"></iframe>
<div id="intro">Saath<br><span id="introLine" style="font-weight:500;opacity:.8"></span></div>
<button id="start">Loading…</button>
<a id="home" href="#" role="button">Back to Saath</a>
<div id="overlay"><div id="hud" aria-hidden="true"></div><a id="back" href="#" role="button">Back to Saath</a><div id="tip" role="status"></div>
  <div id="talk" hidden>
    <button id="mic" type="button" aria-label="Hold to talk"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2.2"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg></button>
    <div id="hint" role="status">Hold to talk</div>
    <div id="credit">AI friend · Voices: ElevenLabs</div>
  </div>
</div>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<script>   // if three.js (from the internet) or his drawing hasn't arrived after 6 s, say so instead of "Loading…" alone
  setTimeout(() => { const s = document.getElementById('start'); if (!window.ready && s.textContent === 'Loading…') s.textContent = 'Still loading… check the internet, then reload'; }, 6000);
</script>
<script type="module">
import * as THREE from 'three';
import { createTalk } from '../talk/talk.js';

const Q = new URLSearchParams(location.search), PREVIEW = Q.has('preview'), DEBUG = Q.has('debug');
// Which friend, from the app (src/friends.ts): only the rigs there are; the name is only ever used as text. An id
// not in this list is a bug (the app sends only these), so it says so rather than quietly showing Nobita.
const FRIENDS = ['doraemon', 'nobita', 'shinchan', 'goku', 'michael', 'dwight', 'holt'], FRIEND = Q.get('friend') ?? 'nobita';
if (!FRIENDS.includes(FRIEND)) { document.body.textContent = `Unknown friend: ${FRIEND}`; throw new Error(`unknown friend ${FRIEND}`); }
const NAME = (Q.get('name') || FRIEND).slice(0, 24), TALL_M = Number(Q.get('tall')) || 1.4;   // their height in metres
const BACK = Q.get('return');   // a deep link back into the app, if it opened this page
const VFOV = 72.7;    // S24 main camera (notes/ar-stability.md); only the preview camera uses it
// Pokémon GO AR+ distances: under 1 m you're told to step back, cleared past 1.2 m.
const NEAR_M = 1.0, CLEAR_M = 1.2;
// The room's light only sets his brightness, between 80% and 100% of the art, with no colour cast, so he
// sits in the room but still looks like himself. shortcut: ARCore's light units are taken as-is; tune ?gain on the phone.
const GAIN = Number(Q.get('gain')) || 1.5, DIMMEST = 0.8;
const tipEl = document.getElementById('tip'), start = document.getElementById('start'), intro = document.getElementById('intro');
const overlay = document.getElementById('overlay'), hud = document.getElementById('hud');
const tip = (s) => { if (tipEl.textContent !== s) tipEl.textContent = s; tipEl.style.display = s ? 'block' : 'none'; };
const canvasTex = (w, h, paint) => {
  const c = Object.assign(document.createElement('canvas'), { width: w, height: h });
  paint(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
};

// ---- The friend: the app's own 2D rig, copied onto a card that stands on the floor ----------------
// The rig page runs in a same-origin frame with its clock loops removed, so this page drives it
// (renderAt) and copies each new drawing (12 a second) into a canvas texture.
const frame = document.getElementById('rig');
const rigRes = await fetch(`rigs/${FRIEND}.html`, { cache: 'no-store' }).catch(() => null);
if (!rigRes?.ok) { start.textContent = `Couldn’t load ${NAME}: go back and try again`; start.disabled = true; throw new Error(`no rig for ${FRIEND}`); }
const rigHtml = (await rigRes.text()).replaceAll('requestAnimationFrame(loop);', '');
// The frame's first, blank page can finish loading after the fetch above, so wait for the load that has the rig in it.
await new Promise((r) => {
  frame.addEventListener('load', function loaded() { if (frame.contentWindow.saath) { frame.removeEventListener('load', loaded); r(); } });
  frame.srcdoc = rigHtml;
});
const rig = frame.contentWindow;
const svg = [...frame.contentDocument.body.children].find((e) => e.tagName === 'svg' && e.querySelector('.head'));
const vb = svg.getAttribute('viewBox').split(/[\s,]+/).map(Number), A = rig.SAATH_AR;
const own = svg.querySelector('.contact'); if (own) own.style.display = 'none';   // he gets a real shadow instead
const PX_H = 1024, PX_W = Math.round((PX_H * vb[2]) / vb[3]);
const art = Object.assign(document.createElement('canvas'), { width: PX_W, height: PX_H }), artG = art.getContext('2d');
const artTex = new THREE.CanvasTexture(art); artTex.colorSpace = THREE.SRGBColorSpace;
let dirty = true, drawing = null;
const changes = new MutationObserver(() => (dirty = true));
changes.observe(svg, { attributes: true, childList: true, subtree: true });
// His idle loop, already pictured: standing idle he shows the same drawings again every 4-10 s, and turning SVG into
// pixels is most of his cost. A drawing of his idle clip with no talking face is kept the first time, by its SVG text: a
// copy of the canvas cut to his pixels (an eighth to under half of it), until PICS_B bytes, keys counted, one at a time.
// Where his pixels are, a worker finds in the same SVG pictured on the CPU (reading back the GPU's copy waits for the GPU
// to catch up, seconds when it lags), give or take EDGE px where the two rasterisers' edges differ. Nothing is pushed
// out: LRU would push out each one just before it came round again. His hi, a gesture or a talking mouth seldom repeats.
const pics = new Map(), PICS_B = 60 << 20, EDGE = 2;
let picsB = 0, picsFull = false, cutting = null;
const cutter = new Worker(URL.createObjectURL(new Blob([`onmessage = ({ data: bmp }) => {
  const { width: w, height: h } = bmp, g = new OffscreenCanvas(w, h).getContext('2d', { willReadFrequently: true });
  g.drawImage(bmp, 0, 0); bmp.close();
  const px = new Uint32Array(g.getImageData(0, 0, w, h).data.buffer);   // 0 exactly where alpha is 0
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0, i = 0; y < h; y++) for (let x = 0; x < w; x++, i++) if (px[i]) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; y1 = y; }
  postMessage([x0, y0, x1, y1]);
}`], { type: 'text/javascript' })));
const drop = () => { cutting?.full.then((f) => f.close(), () => {}); cutting = null; };
cutter.onerror = drop;
cutter.onmessage = async ({ data: [x0, y0, x1, y1] }) => {
  const { text, full } = cutting, x = Math.max(0, x0 - EDGE), y = Math.max(0, y0 - EDGE);
  const bmp = x1 < 0 ? null : await full.then((f) => createImageBitmap(f, x, y, Math.min(PX_W, x1 + 1 + EDGE) - x, Math.min(PX_H, y1 + 1 + EDGE) - y)).catch(() => null);
  drop();
  const b = bmp && bmp.width * bmp.height * 4 + text.length;
  if (!bmp || pics.has(text)) bmp?.close();
  else if (picsB + b > PICS_B) { bmp.close(); picsFull = true; }   // no more copies
  else { pics.set(text, { bmp, x, y }); picsB += b; }
};
const rasterise = () => {
  // A drawing made this frame is pictured this frame: the observer's own callback only runs after the frame, which
  // put every mouth a frame late (about 60 ms).
  if (changes.takeRecords().length) dirty = true;
  if (!dirty || drawing) return drawing || Promise.resolve();
  dirty = false;
  const c = svg.cloneNode(true);
  c.removeAttribute('style'); c.setAttribute('width', PX_W); c.setAttribute('height', PX_H); c.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  // His hidden parts (spare hands, Nobita's dog) stay out of the copy: the same picture, less to parse and draw. Not
  // one holding an id: a gradient or clip in a hidden part can still be used by a shown one.
  for (const e of c.querySelectorAll(':is([style*="display:none"], [style*="display: none"]):not([id], :has([id]))')) e.remove();
  // A part hidden and shown again keeps an empty style="": no effect on the picture, but it made one drawing two texts.
  for (const e of c.querySelectorAll('[style=""]')) e.removeAttribute('style');
  const text = new XMLSerializer().serializeToString(c), pic = pics.get(text);
  if (pic) { artG.clearRect(0, 0, PX_W, PX_H); artG.drawImage(pic.bmp, pic.x, pic.y); artTex.needsUpdate = true; return Promise.resolve(); }
  const { clip, face } = rig.saath.now(), idle = !picsFull && clip === A.roles.idle && !Object.keys(face).length;
  const url = URL.createObjectURL(new Blob([text], { type: 'image/svg+xml' }));
  const img = new Image();
  drawing = new Promise((done) => {
    img.onload = () => { artG.clearRect(0, 0, PX_W, PX_H); artG.drawImage(img, 0, 0, PX_W, PX_H); artTex.needsUpdate = true; done();
      if (idle && !cutting) {   // the canvas is copied now, as drawn
        cutting = { text, full: createImageBitmap(art) };
        createImageBitmap(img).then((cpu) => cutter.postMessage(cpu, [cpu]), drop);
      }
    };
    img.onerror = done;
    img.src = url;
  }).finally(() => { URL.revokeObjectURL(url); drawing = null; });
  return drawing;
};

// ---- The scene: the friend (card, two shadows), the floor ring, the pop-in sparkles -------
const scene = new THREE.Scene();
const unitM = TALL_M / A.tall, cardW = vb[2] * unitM, cardH = vb[3] * unitM;
const cardGeo = new THREE.PlaneGeometry(cardW, cardH);
cardGeo.translate(-((A.ground[0] - vb[0]) / vb[2] - 0.5) * cardW, ((A.ground[1] - vb[1]) / vb[3] - 0.5) * cardH, 0);   // feet at the origin
const card = new THREE.Mesh(cardGeo, new THREE.MeshBasicMaterial({ map: artTex, transparent: true, alphaTest: 0.03 }));
let cardDrawn = false;   // his card was drawn last frame: three.js draws (and calls this for) only what is in view
card.onBeforeRender = () => { cardDrawn = true; };
// A soft dark ellipse on the floor, w x d metres, alpha falling off along `stops` ([radius 0-1, alpha]).
const blob = (w, d, stops) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, map: canvasTex(128, 128, (g) => {
    const r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    for (const [at, a] of stops) r.addColorStop(at, `rgba(20,14,8,${a})`);
    g.fillStyle = r; g.fillRect(0, 0, 128, 128);
  }) }));
  m.position.y = 0.002; m.renderOrder = -1; return m;
};
// A tight dark core under his (0.46 m wide) shoes plus a wide soft shadow cast away from the light.
const shadows = [blob(0.62, 0.22, [[0, 0.9], [0.45, 0.62], [0.75, 0.2], [1, 0]]), blob(1, 0.7, [[0, 0.42], [0.5, 0.22], [1, 0]])];
const soft = shadows[1];

// ARCore's light estimate, shaded the way ARCore's own sample does (hello_ar_java environmental_hdr.frag):
// 9 SH terms pre-scaled by these factors (basis, 1/pi, cosine lobe) plus the main light's Lambert term.
const SH_K = [0.282095, -0.325735, 0.325735, -0.325735, 0.273137, -0.273137, 0.078848, -0.273137, 0.136569];
const lightAt = (est, n, out) => {
  const c = est.sphericalHarmonicsCoefficients, { x, y, z } = n, basis = [1, y, z, x, y * x, y * z, 3 * z * z - 1, z * x, x * x - y * y];
  const d = est.primaryLightDirection, I = est.primaryLightIntensity, lambert = Math.max(0, x * d.x + y * d.y + z * d.z) / Math.PI;
  const sh = (ch) => Math.max(0, basis.reduce((sum, b, i) => sum + c[i * 3 + ch] * SH_K[i] * b, 0));
  return out.setRGB(sh(0) + I.x * lambert, sh(1) + I.y * lambert, sh(2) + I.z * lambert);
};

const figure = new THREE.Group();
figure.add(...shadows, card); figure.visible = false; scene.add(figure);

// The gold ring with footprints that marks where he will come out.
const reticle = new THREE.Group(), reticleInner = new THREE.Group();
reticle.matrixAutoUpdate = false; reticle.visible = false; reticle.add(reticleInner); scene.add(reticle);
const flat = (geo, color, opacity = 1) => new THREE.Mesh(geo.rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color, transparent: opacity < 1, opacity, depthWrite: false }));
reticleInner.add(flat(new THREE.CircleGeometry(0.2, 48), 0xffc457, 0.28), flat(new THREE.RingGeometry(0.19, 0.225, 48), 0xffb43c));
for (const x of [-0.065, 0.065]) { const f = flat(new THREE.CircleGeometry(0.04, 20), 0xffc457); f.position.set(x, 0.001, 0); reticleInner.add(f); }

// Sparkles and a dust ring when he pops in (like a Pokémon bursting out of the grass).
let seed = 7; const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const sparkTex = canvasTex(64, 64, (g) => {
  const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.3, 'rgba(255,214,90,1)'); r.addColorStop(1, 'rgba(255,180,60,0)');
  g.fillStyle = r; g.fillRect(0, 0, 64, 64);
});
const sparks = Array.from({ length: 18 }, () => {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: sparkTex, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
  s.visible = false; scene.add(s); return s;
});
const dust = flat(new THREE.RingGeometry(0.85, 1, 48), 0xffe2a6, 0.6); dust.visible = false; scene.add(dust);

let placedAt = null, floorY = null;
const place = (pos, now) => {
  figure.position.copy(pos); figure.visible = true; placedAt = now; reticle.visible = false;
  dust.position.copy(pos).setY(pos.y + 0.003);
  sparks.forEach((s, i) => {
    const a = (i / sparks.length) * Math.PI * 2 + rand() * 0.5, sp = 0.45 + rand() * 0.6;
    s.userData = { p0: pos.clone().add(new THREE.Vector3(0, 0.15, 0)), v: new THREE.Vector3(Math.cos(a) * sp, 1.1 + rand() * 1.3, Math.sin(a) * sp), size: 0.06 + rand() * 0.07 };
  });
  rig.renderAt(now); cardDrawn = true;   // his drawing waited until now (AR): its clock first, so his hi plays from the start
  rig.saath.play(['hi']);
  tip(`${NAME} is here! Walk around him.`);
  showBack();
  talkEl.hidden = false; overlay.classList.add('talk');
};

// Talking: hold the mic to ask; web/talk/talk.js listens, fetches the reply and times his face to his voice. No words
// are shown, his or yours (the user, 18 Oct: "just audio"): the hint under the mic says what to do, that he is
// thinking, or what went wrong.
const talkEl = document.getElementById('talk'), hintEl = document.getElementById('hint'), mic = document.getElementById('mic');
// ?lip=0.1 moves his mouth that many seconds later (for Bluetooth earbuds); ?debug shows each turn's timings.
const talkTimes = {}, HOLD = 'Hold to talk', LISTENING = 'Listening… let go to send';
let heard = '', error = '', listening = false, thinking = false;
const hint = () => { hintEl.textContent = listening ? LISTENING : thinking ? `${NAME} is thinking…` : error || HOLD; };
const talk = createTalk({ friend: FRIEND, lip: Number(Q.get('lip')) || 0, onEvent: (type, data) => {
  if (type === 'state') { listening = data === 'listening'; thinking = data === 'thinking'; if (listening || thinking) error = ''; mic.classList.toggle('on', listening); hint(); }
  else if (type === 'heard') heard = data;
  else if (type === 'error') { error = data; hint(); }
  else if (type === 'cue') rig.saath.act(data.action);
  else if (type === 'timing') { if (data.name === 'heard') for (const k in talkTimes) delete talkTimes[k]; talkTimes[data.name] = data.ms; }
} });
// His face while talking, given to the rig only when it changes (it shows from his next drawing).
let shownFace = '';
const faceTo = (f) => { const k = f ? f.mood + f.mouth : ''; if (k !== shownFace) { shownFace = k; rig.saath.face(f); } };
mic.addEventListener('pointerdown', (e) => { e.preventDefault(); mic.setPointerCapture?.(e.pointerId); talk.listen(); });
for (const type of ['pointerup', 'pointercancel']) mic.addEventListener(type, () => talk.send());
mic.addEventListener('contextmenu', (e) => e.preventDefault());   // no long-press menu while holding
talkEl.addEventListener('beforexrselect', (e) => e.preventDefault());   // talking isn't an AR tap

// Back into the app. Chrome hands an Android intent link straight to the app (Expo Go while developing); once
// they have met, the link says so (met=1, kept in this page's URL so a reload remembers it).
const home = document.getElementById('home'), back = document.getElementById('back');
const homeLink = () => {
  const u = new URL(BACK);
  if (new URLSearchParams(location.search).get('met') === '1') u.searchParams.set('met', '1');
  return `intent://${u.host}${u.pathname}${u.search}#Intent;scheme=${u.protocol.slice(0, -1)};${u.protocol === 'exp:' ? 'package=host.exp.exponent;' : ''}end`;
};
const showBack = () => {
  try { const u = new URL(location.href); u.searchParams.set('met', '1'); history.replaceState(null, '', u); } catch {}
  back.style.display = BACK ? 'block' : 'none';
};
for (const el of [home, back]) {
  el.addEventListener('click', (e) => { e.preventDefault(); location.href = homeLink(); });
  el.addEventListener('beforexrselect', (e) => e.preventDefault());   // a tap on it isn't an AR tap
}
if (BACK) home.style.display = 'block';
document.getElementById('introLine').textContent = `Point your phone at the floor a few steps away, then tap the gold ring: ${NAME} comes to it`;
const backOut = (x) => 1 + 2.70158 * (x - 1) ** 3 + 1.70158 * (x - 1) ** 2;
const UP = new THREE.Vector3(0, 1, 0), facing = new THREE.Vector3(), away = new THREE.Vector3(), lit = new THREE.Color(), want = new THREE.Color();
let lastNow = 0, close = false;
// Each frame: the pop-in, the sparkles, the pulsing ring; he turns to face the camera, takes the
// room's brightness, and if you come within 1 m he stays on his spot while the view greys and asks you to
// step back. est: the room's light (an XRLightEstimate), or null.
const update = (now, cam, est) => {
  reticleInner.scale.setScalar(1 + 0.05 * Math.sin(now * 5));
  const dt = Math.min(1, Math.abs(now - lastNow)), dist = Math.hypot(cam.x - figure.position.x, cam.z - figure.position.z);
  lastNow = now;
  if (DEBUG) hud.textContent = (floorY === null ? '' : `floor ${(cam.y - floorY).toFixed(2)} m below` + (placedAt === null ? '' : ` · ${NAME} ${dist.toFixed(2)} m away`))
    + (Object.keys(talkTimes).length ? ' · ' + Object.entries(talkTimes).map(([k, ms]) => `${k} ${ms}`).join(' ') + ' ms' : '');
  if (placedAt === null) return;
  const k = now - placedAt;
  close = dist < NEAR_M || (close && dist < CLEAR_M);
  overlay.classList.toggle('close', close);
  tip(close ? 'You’re too close — step back a little' : k < 3.6 ? `${NAME} is here! Walk around him.` : '');   // then only him and the mic
  card.scale.setScalar(k < 0.45 ? Math.max(0.001, backOut(k / 0.45)) : 1);
  for (const s of shadows) s.material.opacity = Math.min(1, k / 0.35);
  figure.rotation.y = Math.atan2(cam.x - figure.position.x, cam.z - figure.position.z);
  // Gentle room light: the brightness of the light falling on his front, kept between 80% and 100%, eased over ~0.3 s.
  if (est) {
    lightAt(est, facing.set(cam.x - figure.position.x, 0, cam.z - figure.position.z).normalize(), lit);
    const b = THREE.MathUtils.clamp((0.2126 * lit.r + 0.7152 * lit.g + 0.0722 * lit.b) * GAIN, DIMMEST, 1);
    want.setRGB(b, b, b);
  } else want.setRGB(1, 1, 1);
  card.material.color.lerp(want, 1 - Math.exp(-dt / 0.3));
  // With a main light the soft shadow narrows to 0.8 m, slides away from the light and stretches that way,
  // further for a lower light (reach = 1 at 45°); without one it stays a 1 x 0.7 m ellipse under him.
  const d = est?.primaryLightDirection, I = est?.primaryLightIntensity;
  const reach = est && I.x + I.y + I.z > 0 ? Math.min(1.5, Math.hypot(d.x, d.z) / Math.max(0.05, d.y)) : 0;
  away.set(reach ? -d.x : 0, 0, reach ? -d.z : 0).normalize();
  soft.rotation.y = reach ? Math.atan2(away.x, away.z) - figure.rotation.y : 0;
  soft.scale.set(reach ? 0.8 : 1, 1, reach ? (0.8 * (1 + 0.5 * reach)) / 0.7 : 1);
  soft.position.copy(away).multiplyScalar(0.2 * reach).applyAxisAngle(UP, -figure.rotation.y).setY(0.002);
  dust.visible = k < 0.6;
  if (dust.visible) { dust.scale.setScalar(0.15 + (k / 0.6) * 0.6); dust.material.opacity = 0.6 * (1 - k / 0.6); }
  for (const s of sparks) {
    s.visible = k < 0.9;
    if (!s.visible) continue;
    const { p0, v, size } = s.userData;
    s.position.copy(p0).addScaledVector(v, k).add(new THREE.Vector3(0, -1.6 * k * k, 0));
    s.material.opacity = 1 - k / 0.9; s.scale.setScalar(size * (1 - 0.4 * k));
  }
};

// ---- His spot: you choose it (the user, 18 Oct: "ask the user to set the point on the floor"). The gold ring sits where
// the middle of the screen meets a surface facing up, and a tap calls him there. Only 1.2-5 m away (the user: "floor point
// at least 1 to 5 metres"): nearer, he filled the screen and looked stuck on it; Nobita fills most of the screen's height
// at 1.2 m, a fifth at 5 m. The automatic spot this replaces (the floor by your feet first, then seen floor 2.5 m ahead)
// took over a minute in a cluttered room, and you didn't know where he would come.
// The ring stays RING_S after the middle of the screen leaves its spot (a hit test missing a frame, a shaky hand), so a
// tap as you hold still never misses it. p: where the middle of the screen meets a surface facing up, or null.
const NEAR_SPOT = 1.2, FAR_SPOT = 5, RING_S = 0.3;
let ringAt = -Infinity;
const aim = (p, cam, now) => {
  const d = p ? Math.hypot(p.x - cam.x, p.z - cam.z) : NaN;
  if (d >= NEAR_SPOT && d <= FAR_SPOT) { reticle.matrix.makeTranslation(p.x, p.y, p.z); floorY = p.y; ringAt = now; }
  reticle.visible = now - ringAt < RING_S;
  tip(reticle.visible ? `Tap to bring ${NAME} to the ring` : d < NEAR_SPOT ? 'Too close: point at the floor a bit further away'
    : d > FAR_SPOT ? 'Too far: point at the floor a bit closer' : 'Point your phone at the floor a few steps away and move it slowly');
};
// For tests: what the page is doing.
window.state = () => ({ placed: placedAt !== null, at: figure.position.toArray().map((v) => +v.toFixed(3)), ring: reticle.visible,
  ringAt: reticle.visible ? new THREE.Vector3().setFromMatrixPosition(reticle.matrix).toArray().map((v) => +v.toFixed(3)) : null, close, tip: tipEl.textContent, color: card.material.color.toArray().map((v) => +v.toFixed(3)),
  backShown: back.style.display === 'block', back: BACK ? homeLink() : null, talk: talk.state, heard, hint: hintEl.textContent });

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight);
renderer.domElement.className = 'gl'; document.body.prepend(renderer.domElement);
const camera = new THREE.PerspectiveCamera(VFOV, innerWidth / innerHeight, 0.02, 60);
camera.rotation.order = 'YXZ';

if (PREVIEW) {
  // ---- Preview: a room (floor, a 0.5 m box 0.9 m ahead, a 0.45 m bed on the left), the planes ARCore
  // would detect in it, and a scripted phone, rendered one frame at a time (previewAt) ----
  start.style.display = 'none'; intro.style.display = 'none';
  const floorTex = canvasTex(512, 512, (g) => {
    for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) { g.fillStyle = (i + j) % 2 ? '#d9cfbf' : '#d2c7b5'; g.fillRect(i * 256, j * 256, 256, 256); }
    for (let n = 0; n < 900; n++) { g.fillStyle = `rgba(90,70,50,${0.04 + rand() * 0.05})`; g.fillRect(rand() * 512, rand() * 512, 2 + rand() * 5, 1 + rand() * 3); }
    g.strokeStyle = '#b3a690'; g.lineWidth = 6; g.strokeRect(0, 0, 512, 512); g.beginPath(); g.moveTo(256, 0); g.lineTo(256, 512); g.moveTo(0, 256); g.lineTo(512, 256); g.stroke();
  });
  floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping; floorTex.repeat.set(30 / 1.2, 30 / 1.2); floorTex.anisotropy = 8;
  // renderOrder -2: three.js sorts opaque meshes by material before depth, so without it the room would be
  // drawn after the ring's band and footprints (which write no depth) and hide them.
  scene.add(Object.assign(new THREE.Mesh(new THREE.PlaneGeometry(30, 30).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ map: floorTex })), { renderOrder: -2 }));
  scene.background = new THREE.Color('#ece7df');
  const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x)), rad = THREE.MathUtils.degToRad;
  const block = (w, h, d, x, y, z, [top, side, front]) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), [side, side, top, top, front, side].map((color) => new THREE.MeshBasicMaterial({ color })));
    m.position.set(x, y, z); m.renderOrder = -2; m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), new THREE.LineBasicMaterial({ color: '#7a6a58' }))); scene.add(m);
  };
  block(5.4, 2.6, 0.01, -0.1, 1.3, -4.6, ['#e6dfd3', '#e6dfd3', '#e6dfd3']); block(0.01, 2.6, 5.8, -2.8, 1.3, -1.7, ['#dcd4c6', '#dcd4c6', '#dcd4c6']);
  block(0.01, 2.6, 5.8, 2.6, 1.3, -1.7, ['#d6cebf', '#d6cebf', '#d6cebf']);
  block(0.5, 0.5, 0.5, 0.15, 0.25, -0.9, ['#d9b07c', '#a87c50', '#c49562']);   // the box
  block(1.4, 0.45, 2, -2.1, 0.225, -1.4, ['#9cbbe0', '#6f8fb8', '#86a6cf']);   // the bed
  const rect = (x, y, z, w, d) => ({ m: new THREE.Matrix4().makeTranslation(x, y, z).elements,
    poly: [[-w / 2, -d / 2], [w / 2, -d / 2], [w / 2, d / 2], [-w / 2, d / 2]].map(([a, b]) => ({ x: a, y: 0, z: b })) });
  const planes = [rect(-0.1, 0, -1.7, 5, 5.4), rect(0.15, 0.5, -0.9, 0.5, 0.5), rect(-2.1, 0.45, -1.4, 1.4, 2)];   // floor, box top, bed top
  // A plain room light as ARCore would report it: an even glow (SH constant term) and a soft lamp up to the left.
  const sh = new Float32Array(27); [0.5, 0.5, 0.5].forEach((v, i) => (sh[i] = v / 0.282095));
  const LAMP = new THREE.Vector3(-0.55, 0.7, 0.45).normalize();
  const roomLight = { sphericalHarmonicsCoefficients: sh, primaryLightDirection: LAMP, primaryLightIntensity: { x: 0.25, y: 0.25, z: 0.25 } };
  const EYE = 1.4, look = new THREE.Vector3(), aim0 = new THREE.Vector3(), P = new THREE.Vector3(), dir = new THREE.Vector3(), o = new THREE.Vector3();
  let placedT = null;
  // 0-1 s: the phone tips down to the floor about 2.4 m ahead (the ring appears on it), glancing left towards the bed
  // and back by 1.5 s; at 2 s a tap calls him. Then walk up to him until the view greys, and step back.
  const scan = (s) => {
    const g = Math.sin(Math.PI * ease((s - 0.3) / 1.2));
    camera.position.set(0, EYE, 0); camera.rotation.set(rad(-30 * ease(s / 1)), rad(25 * g), 0); camera.updateMatrixWorld();
  };
  const hitAhead = () => {   // the preview's hit test: where the middle of the view meets the nearest of the planes, 4 mm up (the simulated floor is a real surface)
    camera.getWorldDirection(dir);
    let best = null;
    for (const { m, poly } of planes) {
      const t = (m[13] - camera.position.y) / dir.y;
      if (!(dir.y < 0) || t <= 0 || (best && t >= best.t)) continue;
      o.copy(camera.position).addScaledVector(dir, t);
      const xs = poly.map((q) => q.x), zs = poly.map((q) => q.z);
      if (o.x - m[12] >= Math.min(...xs) && o.x - m[12] <= Math.max(...xs) && o.z - m[14] >= Math.min(...zs) && o.z - m[14] <= Math.max(...zs)) best = { t, p: o.clone().setY(m[13] + 0.004) };
    }
    return best?.p ?? null;
  };
  window.previewAt = async (t) => {
    faceTo(talk.face());
    rig.renderAt(t);
    if (placedT === null) {
      scan(t);
      aim(hitAhead(), camera.position, t);
      if (reticle.visible && t >= 2) {   // the tap
        P.setFromMatrixPosition(reticle.matrix); placedT = t; place(P.clone(), t);
        aim0.copy(camera.position).addScaledVector(camera.getWorldDirection(dir), 2);
      }
    } else {
      const k = t - placedT, r0 = Math.hypot(P.x, P.z), phi0 = Math.atan2(-P.x, -P.z);
      const walkIn = ease((k - 3) / 2.5), walkOut = ease((k - 6.5) / 2.5), r = r0 + (0.8 - r0) * walkIn + (2.2 - 0.8) * walkOut;
      const phi = phi0 + rad(25 * walkOut);
      camera.position.set(P.x + r * Math.sin(phi), EYE + 0.01 * Math.sin(t * 7.1), P.z + r * Math.cos(phi));
      camera.lookAt(look.lerpVectors(aim0, new THREE.Vector3(P.x, P.y + 0.7, P.z), ease(k / 1.2)));
    }
    camera.updateMatrixWorld();
    await Promise.resolve(); await rasterise();
    update(t, camera.position, roomLight);
    renderer.render(scene, camera);
    return window.state();
  };
} else {
  // ---- AR: ARCore through WebXR. The ring follows the hit test down the middle of the screen (ARCore's own detected
  // surfaces), a tap calls him to it, and an anchor holds his spot; the room's light is used when granted ----
  let hitSource = null, anchor = null, probe = null, light = null;
  const cam = new THREE.Vector3(), here = new THREE.Vector3(), hit = new THREE.Vector3();
  const base = new THREE.Vector3(), lastCam = new THREE.Vector3(), gap = new THREE.Vector3(), moved = new THREE.Vector3();   // base: his spot, then his anchor's pose
  const GLIDE = 1;   // m/s: the fastest an anchor correction moves him
  const ok = navigator.xr && (await navigator.xr.isSessionSupported('immersive-ar').catch(() => false));
  start.textContent = ok ? 'Start AR' : 'AR is not available in this browser';
  start.disabled = !ok;
  const anchorAt = (xrFrame, p) => {
    try { xrFrame.createAnchor?.(new XRRigidTransform({ x: p.x, y: p.y, z: p.z }), renderer.xr.getReferenceSpace())?.then((a) => (anchor = a), () => {}); } catch {}
  };
  // He comes out at p (only ever the ring, so 1.2-5 m away) and is anchored there.
  const comeOut = (p, xrFrame, now) => { place(p, now); base.copy(p); anchorAt(xrFrame, p); };
  // Talking needs the mic, and its prompt comes as the page opens, before AR: inside AR it may not show, and on a
  // tap it outlasted the tap AR needs, so Start took two taps (18 Oct).
  if (ok) navigator.permissions?.query({ name: 'microphone' }).then((p) => {
    if (p.state === 'prompt') navigator.mediaDevices.getUserMedia({ audio: true }).then((s) => s.getTracks().forEach((t) => t.stop()), () => {});
  }, () => {});
  start.onclick = async () => {
    let session = null;
    try {
      // No plane-detection: his spot comes from the hit test alone, and Chrome handing over every plane's outline each
      // frame was work the phone no longer needs to do.
      session = await navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['hit-test'],
        optionalFeatures: ['dom-overlay', 'anchors', 'light-estimation'],
        domOverlay: { root: overlay },
      });
      const has = (f) => !!session.enabledFeatures?.includes(f);
      renderer.xr.enabled = true; renderer.xr.setReferenceSpaceType('local');
      await renderer.xr.setSession(session);
      hitSource = await session.requestHitTestSource({ space: await session.requestReferenceSpace('viewer') });
      if (has('light-estimation')) probe = await session.requestLightProbe().catch(() => null);
    } catch (e) {   // camera refused, ARCore declined, or no hit tests: say so, rather than a button that does nothing
      session?.end().catch(() => {});
      start.textContent = e?.name === 'NotAllowedError' ? 'Camera blocked: allow it for this site, then tap again' : 'AR couldn’t start: tap to try again';
      return;
    }
    // A tap on the screen (not on the mic or Back, which stop it) calls him to the ring.
    session.addEventListener('select', (e) => {
      if (placedAt !== null || !reticle.visible) return;
      comeOut(here.setFromMatrixPosition(reticle.matrix).clone(), e.frame, performance.now() / 1000);   // the event's frame is only live during this call
    });
    session.addEventListener('end', () => location.reload());
    start.style.display = 'none'; intro.style.display = 'none'; home.style.display = 'none';
    back.style.display = BACK ? 'block' : 'none';   // a way out before he comes (met=1 is added only once he's out)
    tip('Point your phone at the floor a few steps away and move it slowly');
  };
  rasterise();   // a first picture of him, as the loop copies him only once he is out: his card is never blank
  renderer.setAnimationLoop((time, xrFrame) => {
    if (!xrFrame) return;   // before Start AR nothing here shows, so nothing is drawn
    const now = performance.now() / 1000;
    if (hitSource) {
      const ref = renderer.xr.getReferenceSpace(), view = xrFrame.getViewerPose(ref);
      if (view) cam.set(view.transform.position.x, view.transform.position.y, view.transform.position.z);
      if (probe) light = xrFrame.getLightEstimate(probe) || light;   // null until ARCore has one; keep the last
      if (placedAt === null) {
        if (!view) { ringAt = -Infinity; aim(null, cam, now); }   // no tracking, no ring (and the tip says to aim again, not to tap)
        else {
          // Only the nearest hit is what the camera sees: ARCore also returns surfaces further along the ray, such as the
          // floor behind a bed. A hit pose's Y axis is the surface normal, so m[5] > 0.9 is a surface facing up.
          const m = xrFrame.getHitTestResults(hitSource)[0]?.getPose(ref)?.transform.matrix;
          aim(m && m[5] > 0.9 ? hit.set(m[12], m[13], m[14]) : null, cam, now);
        }
      }
      if (placedAt !== null) {
        // He goes where his anchor is as ARCore refines it, at walking pace at most: a correction glides, and a one-frame
        // glitch moves him a centimetre or two, so he never jumps towards you. When ARCore re-fixes its map (or moves the
        // floor) the camera and his anchor take the same step in one frame: he takes it at once, which on screen is no jump
        // at all. (Going by a camera jump over 20 cm alone let 8-19 cm re-fixes show as a jump or a slide.)
        const p = anchor && xrFrame.trackedAnchors?.has(anchor) && xrFrame.getPose(anchor.anchorSpace, ref)?.transform.position;
        moved.set(0, 0, 0);
        if (p) { moved.set(p.x - base.x, p.y - base.y, p.z - base.z); base.set(p.x, p.y, p.z); }
        // Or the camera jumped over 20 cm (a re-fix while you walk, or after tracking came back while you walked): your own
        // steps are in that jump too, so it never matches his anchor's.
        if (moved.distanceTo(gap.subVectors(cam, lastCam)) < 0.03 || gap.length() > 0.2) figure.position.add(moved);
        gap.set(base.x, base.y, base.z).sub(figure.position);
        figure.position.add(gap.clampLength(0, GLIDE * Math.min(0.1, now - lastNow)));
      }
      lastCam.copy(cam);
    }
    faceTo(talk.face());
    // His drawing and its copy are most of a frame's work, so none before he is out, and no copy while he is out of view.
    if (placedAt !== null) { rig.renderAt(now); if (cardDrawn) rasterise(); }
    cardDrawn = false;
    update(now, cam, light);
    renderer.render(scene, camera);
  });
}
window.ready = true;
</script>
