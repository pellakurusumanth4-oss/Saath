<script>window.SAATH_AR = {"ground":[200,512],"tall":484,"roles":{"idle":"Idle","hi":"Hi!","arrive":"Buri-buri","extras":["Action Kamen","Yay!","Buri-buri"]}};</script>
<script>
// ---------------------------------------------------------------------------------------------
// Shin-chan as a cut-out rig, drawn the way the current anime draws him. Every outline is traced
// from TV Asahi's official art (tv-asahi.co.jp/shinchan: illust-24 face on, character/01 and
// illust-04 three-quarter, illust-35 from behind) and the colours are that art's own flat palette.
// His head is 44% of his height and wider than his shirt, his mouth sits off to one side on his
// cheek, his brows are fat arches. Posed every 1/12 s ("on 2s"). The drawing is 400 x 520 units,
// head top at y = 28, soles on the ground at 512: 484 units = his 1.0 m.
const C = { red: '#E3002C', skin: '#FBD4AB', yel: '#FFF796', ink: '#231815', shoe: '#FED972', white: '#FFFFFF', mouth: '#B86666', deep: '#6A0F1E', blush: '#F5AC74', hatch: '#E2574C' };
const LW = 3.4;
const LINE = `stroke="${C.ink}" stroke-width="${LW}" stroke-linejoin="round" stroke-linecap="round"`;
const THIN = `fill="none" stroke="${C.ink}" stroke-width="${LW * 0.8}" stroke-linecap="round" stroke-linejoin="round"`;
let uid = 0;
const ID = () => 'k' + (uid++);

// Each view is traced from one official drawing, in that drawing's own pixels; tf() maps them into
// the rig's frame (one scale per drawing, all normalised to his 484-unit height).
const tf = (k, x0, X0, y0, Y0) => (pts) => pts.map(([x, y]) => [X0 + (x - x0) * k, Y0 + (y - y0) * k]);
const VF = tf(484 / 226, 79, 200, 1, 28);    // illust-24: face on
const VQ = tf(1.477, 165, 168, 40, 28);      // character/01: three-quarter head, facing right
const VQB = tf(484 / 222, 80, 200, 0, 28);   // illust-04: three-quarter body
const VB = tf(484 / 244, 78, 200, 1, 28);    // illust-35: from behind, face turned away
const f1 = (v) => v.toFixed(1);
// A smooth ink line through traced points (Catmull-Rom as Béziers); a point marked '*' stays a corner.
function path(s, view, closed = true) {
  const raw = s.trim().split(/\s+/), corner = raw.map((q) => q.endsWith('*'));
  const pts = view(raw.map((q) => q.replace('*', '').split(',').map(Number))), n = pts.length, at = (i) => pts[(i + n) % n];
  let d = `M${f1(pts[0][0])} ${f1(pts[0][1])}`;
  for (let i = 0; i < (closed ? n : n - 1); i++) {
    const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    const s1 = corner[i] || (!closed && i === 0) ? 0 : 1, s2 = corner[(i + 1) % n] || (!closed && i === n - 2) ? 0 : 1;
    d += ` C${f1(p1[0] + s1 * (p2[0] - p0[0]) / 6)} ${f1(p1[1] + s1 * (p2[1] - p0[1]) / 6)} ${f1(p2[0] - s2 * (p3[0] - p1[0]) / 6)} ${f1(p2[1] - s2 * (p3[1] - p1[1]) / 6)} ${f1(p2[0])} ${f1(p2[1])}`;
  }
  return d + (closed ? ' Z' : '');
}
const pt = (view, x, y) => view([[x, y]])[0];
// A limb: a tube with an ink edge (a wider ink stroke underneath).
const tubeEls = (cls, cap = 'round') => `<path class="${cls}" fill="none" stroke="${C.ink}" stroke-linecap="${cap}"/><path class="${cls}" fill="none" stroke-linecap="${cap}"/>`;
const tube = (x1, y1, x2, y2, w, fill) => `<path d="M${x1} ${y1} L${x2} ${y2}" stroke="${C.ink}" stroke-width="${w + 2 * LW}" stroke-linecap="round" fill="none"/>` +
  `<path d="M${x1} ${y1} L${x2} ${y2}" stroke="${fill}" stroke-width="${w}" stroke-linecap="round" fill="none"/>`;
const star = (x, y, r) => `<path d="M${x} ${y - r} Q${x} ${y} ${x + r} ${y} Q${x} ${y} ${x} ${y + r} Q${x} ${y} ${x - r} ${y} Q${x} ${y} ${x} ${y - r} Z" fill="#FFF7C2" stroke="${C.ink}" stroke-width="2" stroke-linejoin="round"/>`;

// ---- Traced outlines (official art pixels) ---------------------------------------------------
const FRONT = {     // illust-24, 158 x 228
  head: '70,2 89,1 103,4 114,11 122,23 127,35* 139,37 150,46 156,60 156,73 151,86 142,94 129,99 103,101 79,98 30,85* 25,89 14,90 8,88 3,83 1,78 1,67 8,53 19,46* 21,40 28,29 43,13 55,5',
  hair: '32,25* 43,13 53,6 66,2 89,1 91,3* 89,7 71,8 58,11 47,17 40,23',
  side: '30,26 34,27 35,31 29,51 27,53* 24,53 19,48 19,44',
  brow: ['37,27* 44,18 52,12 60,10 67,10 73,17 74,23* 72,26 68,26 63,21 58,16 52,21 48,27 44,31 40,30', '86,19* 92,8 99,2 104,2 108,4 116,14 117,19* 114,22 110,22 101,13 92,23'],
  eye: ['56,39 64,39 73,44 76,50 76,57 74,61 63,67 52,67 45,63 43,59 43,51 45,47 51,41', '96,34 107,34 114,40 116,46 114,55 110,59 105,61 96,61 91,59 87,55 85,50 86,43 90,37'],
  eyeC: [[59.5, 53, 16.5, 14], [100.5, 47.5, 15.5, 13.5]],
  lid: ['37,47 42,38 48,32 54,29 60,28 66,30 72,35 74,37', '87,33 93,26 99,22 105,22 111,25 117,31'],
  blush: [[66, 72], [118, 64]],
  mouth: [115.6, 94],
  torso: '36,78 70,86 100,92 125,91 136,84 134,120 134,146* 127,148 100,150 70,151 40,153* 38,128 38,100',
  shorts: '38,151 65,143 106,141 126,140 134,145* 136,181 133,183* 121,185 100,186 70,185 52,186 43,189 24,187* 23,178 26,159',
  crotch: '96,168 95,177 94,184',
};
const QH = {        // character/01, 340 x 420: the three-quarter head, facing right
  head: '158,42 189,42 205,45 220,53 231,65 237,78 239,89* 255,91 267,96 276,104 282,112 285,120 286,126 285,145 280,159 269,172 255,178 235,181 200,180 160,179 120,179 103,178* 87,184 76,185 68,180 64,170 63,160 66,145 72,133 81,125* 82,116 87,99 92,88 105,69 123,54 140,46',
  hair: '81,123 87,99 98,78 109,65 128,51 147,44 158,42 189,42 191,46* 187,49 176,49 154,53 140,58 131,69 109,94* 106,94 101,89* 96,95 98,133* 94,135 87,128 83,127',
  brow: ['128,68* 136,58 145,55 153,60 161,70 161,76* 156,81 149,80 143,74 137,70 131,72', '180,64* 182,57 189,50 197,44 204,40 210,41 228,57 230,61 229,66* 225,69 218,70 206,58 202,56 189,71 183,71'],
  eye: ['147,97 157,97 163,99 169,104 174,116 174,121 170,130 165,134 152,139 138,138 131,134 126,125 127,116 131,108 137,102', '205,86 217,87 228,96 230,103 230,111 226,119 220,124 207,126 196,124 191,120 187,112 188,101 191,95 197,89'],
  eyeC: [[150, 118, 24, 21], [208.5, 106, 21.5, 20]],
  lid: ['112,112 117,98 123,90 129,85 135,82 141,81 147,82 153,83 159,87 165,93 167,96', '186,88 192,76 198,71 204,68 210,67 221,72 226,78 230,86'],
  ear: '96,131 95,137 98,142 102,145',
  blush: [[160, 152], [248, 138]],
  mouth: [233, 171],
};
const QB = {        // illust-04, 155 x 225: the three-quarter body
  torso: '26,90 50,88 73,84 96,80 113,78 118,95 121,102 127,131 128,143* 126,145 109,148 90,150 72,150 61,153 49,151 32,155* 31,151 28,140 27,120',
  shorts: '33,154 46,143 63,143 75,140 85,141 121,138 127,144* 128,167 127,173* 120,176 82,177 79,174* 74,179 30,179* 29,171',
  crotch: '81,166 80,171 79,174',
};
const BK = {        // illust-35, 169 x 247: from behind, face turned away to his right
  head: '80,1 103,1 119,5 140,16 154,29 162,42 167,59 167,77 164,85 156,97 149,104 141,109 132,107 124,110 115,106 103,109 94,102 82,106 77,101 66,102 57,95* 28,100 20,100 8,90 4,83 2,74 3,62 8,51 15,44 23,40 37,39 44,41* 47,37 50,25 54,17 63,8',
  hair: '80,1 103,1 119,5 140,16 154,29 162,42 167,59 167,77 164,85 156,97 149,104 141,109 135,107 129,108 123,104 120,104 109,99 90,95 70,94 67,91 65,83 75,76 77,72 77,67 73,59 63,50 61,41 55,33 53,19 63,8 71,4',
  ear: '64,45 54,44 48,52 48,64 53,75 61,82 68,84',
  earIn: '60,55 56,61 57,69 62,74',
  mouth: '35,79 38,83 39,89 39,96 32,98 31,96 34,94 33,90',
  eyeC: [[31, 47, 5, 7.5]], brow: ['21,38* 27,31 35,29 42,33* 38,37 30,35 25,40'],   // his eye peeking back over the cheek (as in the films)
  torso: '30,92 52,90 78,92 104,90 126,92 127,125 129,158* 112,161 96,164 78,166 60,164 44,161 27,158* 29,125',
  collar: '36,99 42,98 48,97 54,97 60,99 66,104 72,103 78,104 84,108 90,105 96,105 102,110 108,110 114,108 120,111',
  shorts: '30,146 54,148 78,149 102,148 126,146 132,160 136,178 134,194 124,202 104,204 86,202 78,197* 70,202 52,204 32,202 22,194 20,178 24,160',
  seam: '78,160 78,182 78,197',
};

// ---- Where the limbs join, per view (rig units, facing right) --------------------------------
// sh: shoulders, hand: hanging hands, hip / ank: hip joints and ankles (soles 24 below), shoe: drawing.
// L / R are the left and right of the picture: three-quarter on, L is his near arm and leg.
const V = {
  F: { neck: [200, 236], waist: [200, 350], sh: [[102, 229], [317, 229]], hand: [[87, 349], [331, 341]], hip: [[150, 390], [260, 388]], ank: [[146, 488], [264, 488]], shoe: ['front', 'side'], sleeve: 48 },
  Q: { neck: [184, 234], waist: [200, 352], sh: [[92, 236], [283, 229]], hand: [[89, 346], [292, 338]], hip: [[158, 390], [238, 386]], ank: [[152, 488], [236, 488]], shoe: ['side', 'side'], sleeve: 42 },
  B: { neck: [214, 232], waist: [200, 346], sh: [[106, 232], [294, 232]], hand: [[92, 344], [308, 344]], hip: [[150, 398], [250, 398]], ank: [[142, 488], [258, 488]], shoe: ['back', 'back'], sleeve: 46 },
};
const UPPER = 68, FORE = 32;   // shoulder to elbow, elbow to wrist

function drawing() {
  // Eyes: solid black ovals with a white catch-light; half = the lid comes down flat (his smug look).
  const eyeSet = (D, view) => D.eye.map((e, i) => {
    const [cx, cy, rx, ry] = D.eyeC[i], c = pt(view, cx, cy), k = view === VQ ? 1.477 : 484 / 226, w = rx * k, h = ry * k, clip = ID();
    const lidY = c[1] - 0.12 * h;
    return `<g class="eye" data-c="${f1(c[0])} ${f1(c[1])}">` +
      `<g class="eyes eyes-open"><path d="${path(e, view)}" fill="${C.ink}" stroke="${C.ink}" stroke-width="1.5"/><circle class="hl" cx="${f1(c[0])}" cy="${f1(c[1])}" r="${f1(w * 0.3)}" fill="${C.white}"/></g>` +
      `<g class="eyes eyes-half"><clipPath id="${clip}"><rect x="${f1(c[0] - w * 1.4)}" y="${f1(lidY)}" width="${f1(w * 2.8)}" height="${f1(h * 2)}"/></clipPath>` +
      `<path d="${path(e, view)}" fill="${C.ink}" clip-path="url(#${clip})"/><path d="M${f1(c[0] - w * 1.08)} ${f1(lidY + 1)} Q${f1(c[0])} ${f1(lidY - 3)} ${f1(c[0] + w * 1.08)} ${f1(lidY - 1)}" ${THIN} stroke-width="${LW * 1.3}"/></g>` +
      `<g class="eyes eyes-closed"><path d="M${f1(c[0] - w * 0.95)} ${f1(c[1] + h * 0.1)} Q${f1(c[0])} ${f1(c[1] + h * 0.45)} ${f1(c[0] + w * 0.95)} ${f1(c[1] + h * 0.05)}" ${THIN} stroke-width="${LW * 1.4}"/></g>` +
      `<g class="eyes eyes-happy"><path d="M${f1(c[0] - w * 0.9)} ${f1(c[1] + h * 0.35)} Q${f1(c[0])} ${f1(c[1] - h * 0.9)} ${f1(c[0] + w * 0.9)} ${f1(c[1] + h * 0.35)}" ${THIN} stroke-width="${LW * 1.9}"/></g></g>`;
  }).join('');
  const blushSet = (D, view, rx, ry) => { const g = ID(); return `<radialGradient id="${g}"><stop offset="0" stop-color="${C.blush}" stop-opacity="0.95"/><stop offset="1" stop-color="${C.blush}" stop-opacity="0"/></radialGradient>` +
    D.blush.map(([x, y]) => { const c = pt(view, x, y); return `<ellipse cx="${f1(c[0])}" cy="${f1(c[1])}" rx="${rx}" ry="${ry}" fill="url(#${g})"/>` +
      [-0.5, 0, 0.5].map((o) => `<path d="M${f1(c[0] + o * rx - 4)} ${f1(c[1] + 5)} L${f1(c[0] + o * rx + 4)} ${f1(c[1] - 5)}" stroke="${C.hatch}" stroke-width="2" stroke-linecap="round" opacity="0.7"/>`).join(''); }).join(''); };
  // Mouths sit where the official art puts his: low on the cheek, off to the side he faces.
  const mouthSet = (M, big) => {
    const [x, y] = M, s = big ? 1.45 : 1.3, id = ID(), id2 = ID();
    const id3 = ID(), oe = `cx="${f1(x)}" cy="${f1(y + 3 * s)}" rx="${f1(12.5 * s)}" ry="${f1(13.5 * s)}" transform="rotate(-15 ${f1(x)} ${f1(y)})"`;
    const o = `<clipPath id="${id3}"><ellipse ${oe}/></clipPath><ellipse ${oe} fill="${C.deep}"/><ellipse cx="${f1(x - 1 * s)}" cy="${f1(y + 15 * s)}" rx="${f1(10 * s)}" ry="${f1(6.5 * s)}" fill="${C.mouth}" clip-path="url(#${id3})"/><ellipse ${oe} fill="none" ${LINE}/>`;
    const D = (a, b, cY) => `M${f1(x - a * s)} ${f1(y - 0.45 * a * s)} L${f1(x + b * s)} ${f1(y - 0.45 * b * s - 0.3 * a * s)} C${f1(x + (b + 6) * s)} ${f1(y + 0.3 * cY * s)} ${f1(x + 0.4 * b * s)} ${f1(y + cY * s)} ${f1(x - 0.2 * a * s)} ${f1(y + cY * s)} C${f1(x - 0.8 * a * s)} ${f1(y + cY * s)} ${f1(x - 1.15 * a * s)} ${f1(y + 0.25 * cY * s)} ${f1(x - a * s)} ${f1(y - 0.45 * a * s)} Z`;
    const open = (a, b, cY, id) => `<clipPath id="${id}"><path d="${D(a, b, cY)}"/></clipPath><path d="${D(a, b, cY)}" fill="${C.deep}"/>` +
      `<ellipse cx="${f1(x - 0.1 * a * s)}" cy="${f1(y + cY * s)}" rx="${f1(0.75 * a * s)}" ry="${f1(0.42 * cY * s)}" fill="${C.mouth}" clip-path="url(#${id})"/><path d="${D(a, b, cY)}" fill="none" ${LINE}/>`;
    return {
      o, closed: `<path d="M${f1(x - 10 * s)} ${f1(y + 2)} Q${f1(x - 1 * s)} ${f1(y + 6 * s)} ${f1(x + 9 * s)} ${f1(y - 2 * s)}" ${THIN}/>`,
      grin: `<path d="M${f1(x - 30 * s)} ${f1(y - 10 * s)} Q${f1(x - 6 * s)} ${f1(y + 13 * s)} ${f1(x + 17 * s)} ${f1(y - 12 * s)}" ${THIN} stroke-width="${LW}"/><path d="M${f1(x + 13 * s)} ${f1(y - 17 * s)} L${f1(x + 19 * s)} ${f1(y - 8 * s)}" ${THIN}/>`,
      wavy: `<path d="M${f1(x - 24 * s)} ${f1(y - 6 * s)} q6,6 12,0 t12,0 t12,0 t8,-2" ${THIN} stroke-width="${LW}"/>`,
      a: open(18, 14, 15, id), laugh: open(28, 20, 30, id2),
    };
  };
  const mouthEls = (M, big) => { const m = mouthSet(M, big); return Object.keys(m).map((k) => `<g class="mouth mouth-${k}">${m[k]}</g>`).join(''); };
  const brows = (D, view) => D.brow.map((b, i) => `<g class="brow brow${i}"><path d="${path(b, view)}" fill="${C.ink}" stroke="${C.ink}" stroke-width="1.6" stroke-linejoin="round"/></g>`).join('');

  const peekEye = () => { const [cx, cy, rx, ry] = BK.eyeC[0], c = pt(VB, cx, cy), w = rx * 484 / 244, h = ry * 484 / 244, clip = ID();
    return `<g class="eyes eyes-open"><ellipse cx="${f1(c[0])}" cy="${f1(c[1])}" rx="${f1(w)}" ry="${f1(h)}" fill="${C.ink}"/><circle cx="${f1(c[0] - w * 0.2)}" cy="${f1(c[1] - h * 0.15)}" r="${f1(w * 0.42)}" fill="${C.white}"/></g>` +
      `<g class="eyes eyes-half"><clipPath id="${clip}"><rect x="${f1(c[0] - w * 2)}" y="${f1(c[1] - h * 0.1)}" width="${f1(w * 4)}" height="${f1(h * 2)}"/></clipPath><ellipse cx="${f1(c[0])}" cy="${f1(c[1])}" rx="${f1(w)}" ry="${f1(h)}" fill="${C.ink}" clip-path="url(#${clip})"/><path d="M${f1(c[0] - w * 1.5)} ${f1(c[1] - h * 0.1)} L${f1(c[0] + w * 1.4)} ${f1(c[1] - h * 0.18)}" ${THIN} stroke-width="${LW * 1.3}"/></g>` +
      `<g class="eyes eyes-closed eyes-happy"><path d="M${f1(c[0] - w * 1.3)} ${f1(c[1])} Q${f1(c[0])} ${f1(c[1] + h * 0.5)} ${f1(c[0] + w * 1.2)} ${f1(c[1])}" ${THIN} stroke-width="${LW * 1.4}"/></g>`; };
  const headF = `<g class="hv hv-F"><path d="${path(FRONT.head, VF)}" fill="${C.skin}" ${LINE}/>` +
    `<g class="blush">${blushSet(FRONT, VF, 30, 15)}</g>` + FRONT.lid.map((l) => `<path d="${path(l, VF, false)}" ${THIN}/>`).join('') +
    eyeSet(FRONT, VF) + `<path d="${path(FRONT.hair, VF)}" fill="${C.ink}" stroke="${C.ink}" stroke-width="1.6"/><path d="${path(FRONT.side, VF)}" fill="${C.ink}"/>` +
    brows(FRONT, VF) + mouthEls(pt(VF, ...FRONT.mouth), false) + '</g>';
  const headQ = `<g class="hv hv-Q"><path d="${path(QH.head, VQ)}" fill="${C.skin}" ${LINE}/><path d="${path(QH.ear, VQ, false)}" ${THIN}/>` +
    `<g class="blush">${blushSet(QH, VQ, 26, 13)}</g>` + QH.lid.map((l) => `<path d="${path(l, VQ, false)}" ${THIN}/>`).join('') +
    eyeSet(QH, VQ) + `<path d="${path(QH.hair, VQ)}" fill="${C.ink}" stroke="${C.ink}" stroke-width="1.6"/>` +
    brows(QH, VQ) + mouthEls(pt(VQ, ...QH.mouth), true) + '</g>';
  const headB = `<g class="hv hv-B"><path d="${path(BK.head, VB)}" fill="${C.skin}" ${LINE}/>` +
    `<path d="${path(BK.ear, VB, false)}" ${THIN}/><path d="${path(BK.earIn, VB, false)}" ${THIN}/>` +
    `<path d="${path(BK.mouth, VB)}" fill="${C.mouth}" ${LINE}/><path d="${path(BK.hair, VB)}" fill="${C.ink}" stroke="${C.ink}" stroke-width="1.6"/>` +
    `<g class="peek">${peekEye()}<path d="${path(BK.brow[0], VB)}" fill="${C.ink}"/></g></g>`;

  // Hands, drawn at the wrist (0,0) pointing down the forearm (+y): a fist, an open hand, five
  // fingers spread ("5 years old!") and a pointing finger.
  const finger = (x1, y1, x2, y2) => tube(x1, y1, x2, y2, 7, C.skin);
  const palm = `<path d="M-11 2 C-16 10 -13 23 -2 25 C9 26 14 16 12 6 C10 -1 -6 -3 -11 2 Z" fill="${C.skin}" ${LINE}/>`;
  const HANDS = {
    fist: `<g transform="scale(1.18)"><path d="M-12 0 C-17 6 -17 22 -8 27 C0 31 12 28 15 18 C17 9 12 1 4 -1 C-2 -2 -8 -2 -12 0 Z" fill="${C.skin}" ${LINE}/><path d="M1 10 C6 11 8 15 6 19" ${THIN}/></g>`,

const t0 = performance.now();
(function loop() { render((performance.now() - t0) / 1000); requestAnimationFrame(loop); })();
post({ type: 'ready' });

} else if (mode === 'still') {   // one clip, big, for checking poses: #mode=still&clip=3 (or &pose={json})
  document.getElementById('title').style.display = 'none';
  const sheet = document.getElementById('sheet'); sheet.style.cssText = 'display:block;padding:0';
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); make(svg); svg.style.cssText = 'width:100%;height:100%'; sheet.appendChild(svg);
  const pose = P.get('pose') ? JSON.parse(P.get('pose')) : null, clip = CLIPS[+(P.get('clip') || 0)];
  render = (t) => apply(svg, pose ? { ...REST, ...pose } : clip[2](step(t % clip[3])));
} else if (mode === 'sheet') {
  const sheet = document.getElementById('sheet');
  const svgs = CLIPS.map(([name, note]) => {
    const cell = document.createElement('div'); cell.className = 'cell';
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); make(svg);
    cell.appendChild(svg); cell.insertAdjacentHTML('beforeend', `<b>${name}</b><span>${note}</span>`); sheet.appendChild(cell);
    return svg;
  });
  render = (t) => CLIPS.forEach(([, , fn, len], i) => apply(svgs[i], fn(step(t % len))));
} else {
  // The friend on the real Delhi Gate plaza (photo: "Shaniwar Wada Main Gate 01" by Pravega, CC0),
  // with Doraemon's camera: placed at his spot, sized by distance (1.0 m tall), contact shadow,
  // the photo's grain over him and his colours softened to the grey day.
  document.getElementById('title').style.display = 'none';
  document.getElementById('sheet').style.display = 'none';
  const street = document.getElementById('street'); street.style.display = 'block';
  const W = innerWidth, H = innerHeight, crop = [424, 0, 432, 960], f = 960, cx = 640, hy = 690, camH = 1.6, k = H / crop[3];
  const photo = document.getElementById('photo'); photo.src = P.get('photo');
  photo.style.transform = `scale(${k}) translate(${-crop[0]}px, ${-crop[1]}px)`;
  const svg = make(document.getElementById('streetChar'));
  svg.style.filter = 'saturate(0.86) brightness(0.97) contrast(0.96)';
  const bubble = document.getElementById('bubble'), hint = document.getElementById('hint');
  const ground = (X, d) => [cx + f * X / d, hy + f * camH / d];
  const place = ([X, d], pose) => {
    const [u, v] = ground(X, d), px = f * 1.0 / d, unit = px / 484;
    const x = (u - crop[0]) * k, y = (v - crop[1]) * k;
    svg.setAttribute('width', 520); svg.setAttribute('height', 600);
    svg.style.transform = `translate(${x}px, ${y}px) scale(${unit * k}) translate(-260px, -572px)`;
    svg.querySelector('.contact').setAttribute('ry', 24); svg.querySelector('.contact').setAttribute('fill', 'rgba(25,20,16,0.34)');
    apply(svg, pose);
    return [x, y - px * k];
  };
  const ringAt = ([X, d], a) => {
    let r = document.getElementById('ring');
    if (!r) { street.insertAdjacentHTML('beforeend', '<svg id="ring" style="position:absolute;left:0;top:0;overflow:visible" width="1" height="1"></svg>'); r = document.getElementById('ring'); }
    const [u, v] = ground(X, d), x = (u - crop[0]) * k, y = (v - crop[1]) * k, rx = f * 0.5 / d * k, ry = rx * camH / d;
    r.innerHTML = a > 0 ? `<ellipse cx="${x}" cy="${y}" rx="${rx * (1 + 0.08 * Math.sin(a * 6))}" ry="${ry}" fill="rgba(255,196,87,0.25)" stroke="#FFB43C" stroke-width="${3.2 * a}" opacity="${a}"/>` +
      `<ellipse cx="${x - rx * 0.22}" cy="${y}" rx="${rx * 0.12}" ry="${ry * 0.45}" fill="#FFC457" opacity="${a}"/><ellipse cx="${x + rx * 0.22}" cy="${y}" rx="${rx * 0.12}" ry="${ry * 0.45}" fill="#FFC457" opacity="${a}"/>` : '';
  };
  const g = document.getElementById('grain'); g.width = W; g.height = H;
  const gc = g.getContext('2d'), im = gc.createImageData(W, H);
  let s = 5; for (let i = 0; i < im.data.length; i += 4) { s = (s * 16807) % 2147483647; const v = 128 + ((s / 2147483647) - 0.5) * 120; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  gc.putImageData(im, 0, 0);
  // His spot lights up; he shuffles in sideways with his back to you, butt wiggling (one small
  // side-step a drawing, 6 a second, feet planted), stops in the ring, turns round and gives you a
  // cheeky look with his brows hopping, walks over three-quarter on (3 steps a second, 0.5 m/s),
  // turns to you and says hi. Everything, his position included, moves on 2s.
  const A = [-0.9, 7.2], B = [0.25, 6.2], SIDE = 0.075, GAP = 54;           // SIDE: m per side-step
  const S0 = [A[0] - 14 * SIDE, A[1]], SHUF0 = 1.6, SHUF1 = SHUF0 + 28 / 12;  // 28 side-steps
  const TURN = Math.atan2(B[0] - A[0], A[1] - B[1]) * 180 / Math.PI;
  const LOOK0 = SHUF1 + 0.25, WALK0 = LOOK0 + 1.0, WALK1 = WALK0 + Math.hypot(B[0] - A[0], B[1] - A[1]) / (3 * 2 * HALF_STEP / 484);
  loopLen = WALK1 + 0.25 + 3.4 + 0.4;
  render = (t) => {
    const ts = step(t);
    hint.style.display = t < 1.4 ? 'block' : 'none';
    bubble.style.display = 'none';
    svg.style.display = t < SHUF0 ? 'none' : '';
    ringAt(A, t >= 1.0 && t < SHUF1 + 0.3 ? Math.min(1, (t - 1.0) / 0.3) * (t > SHUF1 ? (SHUF1 + 0.3 - t) / 0.3 : 1) : 0);
    if (t < SHUF0) return;
    if (ts < SHUF1) {   // back to you, side-stepping right: feet apart, together, apart; hips flip each drawing
      const n = Math.round((ts - SHUF0) * 12), p = { ...REST, view: 'B', peek: 1, bend: 1, y: 8, eyes: 'half', mouth: n % 2 ? 'a' : 'grin', brows: [-8, 0, -8, 0], look: [5, 0] };
      const wide = n % 2 ? SIDE * 484 / 2 : 0;
      p.legL = [0, -wide, 0]; p.legR = [n % 2 ? -10 : 0, wide, n % 2 ? -6 : 0]; p.hip = n % 2 ? 14 : -14; p.hipRot = n % 2 ? 6 : -6; p.lean = n % 2 ? -5 : 5; p.wig = n % 2;
      p.armL = [96 + (n % 2) * 8, -8, 6]; p.armR = [-96 - (n % 2) * 8, 8, 6]; p.handL = p.handR = 'open'; p.head = -6; p.headY = 6;
      place([S0[0] + n * SIDE / 2, S0[1]], p); return;
    }
    if (ts < LOOK0) {   // turns round: from behind, three-quarter, face on
      const i = Math.round((ts - SHUF1) * 12), p = idle(ts);
      if (i < 1) { p.view = 'B'; p.peek = 1; } else if (i < 2) { p.view = 'Q'; p.dir = -1; } p.eyes = 'half'; p.mouth = 'grin';
      place(A, p); return;
    }
    if (ts < WALK0 - 0.17) { const p = idle(ts), m = ts - LOOK0; p.eyes = 'half'; p.mouth = m < 0.4 ? 'grin' : 'o'; p.look = [3, 0];
      p.brows = m > 0.25 && m < 0.75 ? (spinAt(m) % 2 ? [0, 0, 0, 0] : [-11, -3, -11, 3]) : [-4, 0, -4, 0]; place(A, p); return; }
    if (ts < WALK0) { const p = idle(ts); p.view = 'Q'; p.look = [5, 0]; place(A, p); return; }
    if (ts < WALK1) { const k2 = (ts - WALK0) / (WALK1 - WALK0); place([lerp(A[0], B[0], k2), lerp(A[1], B[1], k2)], walk(ts - WALK0, { ...REST }, 1)); return; }
    if (ts < WALK1 + 0.25) { const p = idle(ts), i = Math.round((ts - WALK1) * 12); p.view = i < 2 ? 'Q' : 'F'; p.look = [3, 0]; place(B, p); return; }
    const w0 = WALK1 + 0.25, head = place(B, ts - w0 < 3.3 ? hi(ts - w0) : idle(ts));
    if (ts - w0 > 0.42 && ts - w0 < 2.95) { bubble.style.display = 'block'; bubble.textContent = ts - w0 < 1.7 ? 'Ho-hoi! I’m Shin-chan!' : '5 years old!';
      const bw = bubble.offsetWidth, right = head[0] + 18 + bw < W - 12;
      bubble.style.left = (right ? head[0] + 18 : head[0] - 18 - bw) + 'px'; bubble.style.top = (head[1] - 46) + 'px';
      bubble.style.borderRadius = right ? '16px 16px 16px 4px' : '16px 16px 4px 16px'; }
  };
}
window.renderAt = render;
if (!P.get('capture')) { const t0 = performance.now(); (function loop() { const t = (performance.now() - t0) / 1000; render(mode === 'sheet' ? t : t % loopLen); requestAnimationFrame(loop); })(); }
else render(0);
window.__ready = true;
</script>
