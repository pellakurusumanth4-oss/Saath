.title{position:absolute;left:36px;top:18px;font:800 15px system-ui,Roboto,sans-serif;letter-spacing:.14em;color:#B0702F}

/* Ink: thin, even lines that keep the same weight on screen at any size, the way the anime inks him. */
.ink{stroke:#1D1719;stroke-width:var(--lw);stroke-linejoin:round;stroke-linecap:round}
.ln{fill:none;stroke:#1D1719;stroke-width:var(--lw);stroke-linejoin:round;stroke-linecap:round}
.fine{fill:none;stroke:#1D1719;stroke-width:var(--lwf);stroke-linecap:round}
.under{fill:#1D1719;stroke:#1D1719;stroke-width:var(--lw2);stroke-linejoin:round}
</style>

<body>
<div class="title" id="title">GOKU · 2D ANIME RIG · V1 · STUDIED FROM TOEI'S OFFICIAL FOOTAGE</div>
<div class="sheet" id="sheet"></div>
<div id="street"><img id="photo"><svg class="char" id="streetChar"></svg><div id="bubble"></div><div id="hint">Move your phone slowly to find the ground</div><canvas class="grain" id="grain"></canvas></div>

<script>window.SAATH_AR = {"ground":[0,0],"tall":1750,"roles":{"idle":"Idle","hi":"Hi!","arrive":"Instant Transmission","extras":["Kamehameha!","Yosha!","Starving!","Huh?","Whaaaa?!"]},"mouths":{"closed":"closed","half":"o","open":"a"},"moods":{"neutral":{},"happy":{"eyes":"happy"},"excited":{"eyes":"happy"},"surprised":{"brows":"up"},"curious":{"look":[8,1]},"sad":{"eyes":"half","brows":"up"},"worried":{"brows":"up"},"sleepy":{"eyes":"half"},"thinking":{"look":[0,-6]}},"actions":{"wave":"Hi!","blast":"Kamehameha!","teleport":"Instant Transmission","cheer":"Yosha!","eat":"Starving!","huh":"Huh?","shock":"Whaaaa?!"},"later":["teleport","eat"]};</script>
<script>
// ---------------------------------------------------------------------------------------------
// Son Goku (adult, orange gi) as a cut-out rig, drawn the way Toei's current Dragon Ball anime draws
// him: thin even dark-brown ink, two-tone cel colour (one hard shadow tone, light from the upper
// left), black spiky hair with grey highlight streaks, orange gi over a navy undershirt, indigo
// wristbands, sash and red-trimmed boots, the 悟 badge on his left chest. Colours were measured
// from Toei's official frames (Dragon Ball Super: Beerus opening, 2026). Posed every 1/12 s ("on 2s").
// Units are millimetres: he stands 1750 tall (hair adds about 230 more), feet on the ground at y = 0.
const C = { ink: '#1D1719', hair: '#17151C', hairHi: '#555667', skin: '#FCD5B4', skinSh: '#B87858', gi: '#E96633', giSh: '#A6381C',
  navy: '#234A80', navySh: '#142A50', blue: '#2F3B9E', blueSh: '#1A2162', trim: '#C9432B', white: '#FFFFFF', mouth: '#7E2830', tongue: '#F08C94' };
const LIGHT = [-0.55, -0.835];   // towards the light: upper left of the screen
let uid = 0;
const ID = () => 'g' + (uid++);
const f1 = (v) => Math.round(v * 10) / 10;
const P2 = (p) => `${f1(p[0])} ${f1(p[1])}`;
const LINE = 'class="ink"';

// A closed outline through points whose edges bow outwards by b of their length (inwards for b < 0).
// With flame set, points alternate root, tip, root...: the edge up to each tip bows out and the edge
// down from it bows in, so every lock curves the same way round the head, the way Dragon Ball hair
// is drawn (curved, tapering locks rather than star points).
function spiky(pts, b = 0.07, flame = 0, open = 0) {
  const cx = pts.reduce((s, p) => s + p[0], 0) / pts.length, cy = pts.reduce((s, p) => s + p[1], 0) / pts.length;
  let d = `M${P2(pts[0])}`;
  for (let i = 0; i < pts.length - open; i++) {
    const p = pts[i], q = pts[(i + 1) % pts.length], mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
    let nx = -(q[1] - p[1]), ny = q[0] - p[0];
    if (nx * (mx - cx) + ny * (my - cy) < 0) { nx = -nx; ny = -ny; }
    const k = flame ? (i % 2 ? -flame : flame * 1.4) : b;
    d += ` Q${P2([mx + nx * k, my + ny * k])} ${P2(q)}`;
  }
  return open ? d : d + 'Z';
}
// A limb piece: a tapered tube from a (radius ra) to b (radius rb), fuller in the middle (m1 on its
// left side, m2 on its right), round at both ends.
function seg(a, b, ra, rb, m1, m2 = m1, t = 0.45) {
  const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  const m = [a[0] + dx * t, a[1] + dy * t], o = (p, r) => [p[0] + nx * r, p[1] + ny * r];
  return `M${P2(o(a, ra))} Q${P2(o(m, m1 * 1.15))} ${P2(o(b, rb))} A${f1(rb)} ${f1(rb)} 0 0 0 ${P2(o(b, -rb))} ` +
    `Q${P2(o(m, -m2 * 1.15))} ${P2(o(a, -ra))} A${f1(ra)} ${f1(ra)} 0 0 0 ${P2(o(a, ra))}Z`;
}
// Its cel shadow: a hard band on the side away from the light, from the edge in to k of the radius.
function segShade(a, b, ra, rb, m1, m2 = m1, light = LIGHT, k = 0.22, t = 0.45) {
  const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1, s = (-dy / L * light[0] + dx / L * light[1]) > 0 ? -1 : 1;
  const nx = -dy / L * s, ny = dx / L * s, mm = s > 0 ? m1 : m2, m = [a[0] + dx * t, a[1] + dy * t], o = (p, r) => [p[0] + nx * r, p[1] + ny * r];
  return `M${P2(o(a, ra))} Q${P2(o(m, mm * 1.15))} ${P2(o(b, rb))} L${P2(o(b, rb * k))} Q${P2(o(m, mm * k * 1.15))} ${P2(o(a, ra * k))}Z`;
}
// Parts that overlap read as one shape: all their ink first (a wider stroke), then all their fills.
const union = (ds, fill) => ds.map((d) => `<path d="${d}" class="under"/>`).join('') + ds.map((d) => `<path d="${d}" fill="${fill}"/>`).join('');
const cap = (x1, y1, x2, y2, r) => seg([x1, y1], [x2, y2], r, r, r);

// ---- Hands ------------------------------------------------------------------------------------
// Each hand is drawn with the wrist at 0,0 and the fingers pointing down (+y), thumb on +x.
const HANDS = {
  fist: [cap(0, 44, 0, 56, 46), cap(34, 30, 14, 64, 15)],
  relax: [cap(0, 30, 0, 66, 42), cap(-4, 96, 6, 128, 31), cap(40, 38, 48, 92, 14)],
  open: [cap(0, 34, 0, 70, 42), cap(-30, 96, -46, 150, 11), cap(-11, 100, -17, 172, 12), cap(9, 100, 10, 180, 12), cap(28, 96, 37, 166, 12), cap(40, 46, 80, 92, 13)],
  two: [cap(0, 40, 0, 62, 44), cap(15, 84, 17, 192, 12), cap(-7, 86, -7, 198, 12), cap(34, 38, 18, 78, 15)],
  cup: [cap(0, 34, 0, 64, 42), cap(-30, 88, -16, 146, 11), cap(-9, 94, 10, 156, 12), cap(12, 92, 31, 150, 12), cap(32, 86, 48, 138, 11), cap(42, 40, 76, 70, 13)],
  palm: [cap(0, 34, 0, 70, 42), cap(-28, 96, -34, 158, 11), cap(-10, 100, -11, 174, 12), cap(9, 100, 10, 178, 12), cap(27, 96, 31, 166, 12), cap(40, 46, 72, 96, 13)],
};
const HAND_LINES = {
  fist: 'M-24 96 L-24 78 M-2 100 L-2 80 M20 98 L20 80',
  relax: 'M-14 124 L-12 104 M8 126 L8 106',
  two: 'M-26 92 L-26 76',
  open: '', cup: '', palm: '',
};
function handMarkup(W, rot, hand, mirror) {
  return `<g transform="translate(${P2(W)}) rotate(${f1(rot)}) scale(${mirror * 1.15} 1.15)">${union(HANDS[hand], C.skin)}` +
    (HAND_LINES[hand] ? `<path d="${HAND_LINES[hand]}" class="fine"/>` : '') + '</g>';
}

// ---- Boots ------------------------------------------------------------------------------------
// Ankle at 0,0, sole on y = 95. Indigo with red trim on the rim, the front seam and the sole.
const BOOT_SIDE = 'M-64 -235 L56 -235 L60 -72 Q74 -18 148 18 Q210 44 212 80 L210 95 L-82 95 Q-92 30 -74 -50 Z';
const BOOT_FRONT = 'M-62 -235 L62 -235 L66 -40 Q82 20 76 80 Q62 99 0 99 Q-62 99 -76 80 Q-82 20 -66 -40 Z';
const bootMarkup = (A, deg, side, mirror) => `<g transform="translate(${P2(A)}) rotate(${f1(deg)}) scale(${mirror * 1.18} 1)">` + (side
  ? `<path d="${BOOT_SIDE}" fill="${C.blue}" ${LINE}/><path d="M-74 -50 Q-92 30 -82 95 L-40 95 Q-50 20 -34 -60 L-30 -235 L-64 -235 Z" fill="${C.blueSh}"/>` +
    `<path d="M-64 -235 L56 -235 L57 -212 L-65 -212 Z" fill="${C.trim}" ${LINE}/><path d="M57 -212 L60 -72 Q74 -18 148 18 Q206 42 210 82" fill="none" stroke="${C.trim}" stroke-width="13" stroke-linecap="round"/>` +
    `<path d="M-82 95 L210 95 L211 78 L-84 78 Z" fill="${C.trim}" ${LINE}/><path d="${BOOT_SIDE}" fill="none" ${LINE}/>`
  : `<path d="${BOOT_FRONT}" fill="${C.blue}" ${LINE}/><path d="M24 -235 L62 -235 L66 -40 Q82 20 76 80 Q62 99 30 99 Q44 40 30 -40 Z" fill="${C.blueSh}"/>` +
    `<path d="M-62 -235 L62 -235 L63 -212 L-63 -212 Z" fill="${C.trim}" ${LINE}/><path d="M0 -212 L0 96" stroke="${C.trim}" stroke-width="13"/>` +
    `<path d="M-74 82 Q-60 99 0 99 Q60 99 74 82 L70 72 Q58 86 0 86 Q-58 86 -70 72 Z" fill="${C.trim}"/><path d="${BOOT_FRONT}" fill="none" ${LINE}/>`) + '</g>';

// ---- The drawing --------------------------------------------------------------------------------
// Two views of the head and body, each traced from official frames rather than one warped into
// the other: face on (Beerus opening 68.8 s) and three-quarter, turned about 40° to his left so he
// faces screen right (DAIMA ep. 1, 52.6 s; Beerus opening 4.0 s). Facing left is the mirror image.
const VIEW = {
  front: { sh: [[-290, -1352], [290, -1352]], hip: [[-106, -900], [106, -900]], neck: [0, -1452] },
  '3q': { sh: [[-222, -1352], [222, -1372]], hip: [[-81, -900], [81, -904]], neck: [45, -1452] },
};
// Face on: three big flame-like spikes each side, two at the top, five bangs over the forehead and
// a pointed lock in front of each ear. About three face-widths across, the top 500 above the chin.
const HAIR_F = [[-112, -1590], [-126, -1680], [-286, -1652], [-198, -1730], [-346, -1792], [-222, -1820], [-300, -1934], [-176, -1890],
  [-188, -2034], [-82, -1936], [-40, -2064], [26, -1940], [132, -2034], [160, -1908], [292, -1934], [214, -1830], [346, -1792],
  [212, -1740], [302, -1682], [126, -1680], [112, -1590], [100, -1712], [-100, -1712]];
const BANGS_F = [[-110, -1740], [-98, -1700], [-74, -1744], [-54, -1688], [-30, -1744], [-6, -1676], [16, -1744], [42, -1690], [66, -1742], [98, -1698], [112, -1740],
  [86, -1820], [-86, -1820]];
// Three-quarter (facing screen right): the spikes on his right sweep round to the back, the ones on
// his left poke out past the far cheek; built from the front landmarks turned 40° and checked
// against DAIMA ep. 1 at 52.6 s.
const HAIR_3Q = [[-14, -1600], [-40, -1688], [-216, -1644], [-130, -1736], [-292, -1776], [-160, -1828], [-256, -1934], [-104, -1902],
  [-104, -2044], [6, -1942], [56, -2068], [116, -1942], [222, -2018], [226, -1902], [346, -1882], [246, -1812], [376, -1750],
  [236, -1738], [308, -1668], [166, -1692], [150, -1718], [-34, -1718]];
const BANGS_3Q = [[-30, -1742], [-8, -1702], [20, -1746], [46, -1690], [72, -1746], [98, -1678], [118, -1744], [142, -1694], [158, -1742],
  [150, -1822], [0, -1822]];
const HAIR_HI_F = 'M-224 -1812 L-330 -1798 L-220 -1794 Z M-190 -1890 L-290 -1928 L-184 -1872 Z M-96 -1940 L-180 -2024 L-84 -1926 Z M-34 -1950 L-42 -2046 L-18 -1950 Z M178 -1916 L282 -1928 L182 -1898 Z';
const HAIR_HI_3Q = 'M-150 -1808 L-282 -1778 L-146 -1790 Z M-120 -1892 L-246 -1930 L-114 -1874 Z M-50 -1946 L-96 -2034 L-36 -1934 Z M232 -1890 L334 -1880 L234 -1872 Z';

// The hair, with its grey sheen streaks clipped inside it.
const hairWithSheen = (d, hi) => { const id = ID(); return `<clipPath id="${id}"><path d="${d}"/></clipPath><path d="${d}" fill="${C.hair}" ${LINE}/>` +
  `<g clip-path="url(#${id})"><path d="${hi}" fill="${C.hairHi}" transform="matrix(1 0 0.16 1 270.4 0)"/></g>`; };
// Face on, the hair leans to his right (screen left): everything above the brow is sheared that way.
const lean = (pts, k = 0.16) => pts.map(([x, y]) => [x + k * Math.min(0, y + 1690), y]);
function headFront() {
  // Traced on the Beerus opening at 68.8 s (1.17x, 20 px grid): cheeks ±110, jaw angle ±75 at -1545,
  // chin -1505; eye whites from -1685 (outer, the lid slants down to the nose) to -1642; brows
  // -1694 to -1672; nose tip -1598; mouth -1566; ears ±104 to ±137 from -1690 to -1598.
  const FACE = 'M-100 -1716 L-110 -1650 L-104 -1598 L-75 -1545 L-40 -1512 Q0 -1500 40 -1512 L75 -1545 L104 -1598 L110 -1650 L100 -1716 Z';
  const ear = (s) => `<path d="M${-106 * s} -1676 C${-134 * s} -1700 ${-146 * s} -1660 ${-140 * s} -1630 C${-134 * s} -1606 ${-120 * s} -1592 ${-104 * s} -1600 Z" fill="${C.skin}" ${LINE}/>` +
    `<path d="M${-116 * s} -1664 Q${-134 * s} -1640 ${-120 * s} -1612" class="fine"/><path d="M${-112 * s} -1652 Q${-124 * s} -1640 ${-116 * s} -1622 L${-108 * s} -1620 Z" fill="${C.skinSh}"/>`;
  const eyePair = (fn) => fn(-1) + fn(1);
  const sclera = (s) => `M${-86 * s} -1686 L${-33 * s} -1664 L${-35 * s} -1640 Q${-58 * s} -1634 ${-80 * s} -1643 Z`;
  const EYES = {
    open: (s) => { const id = ID(); return `<clipPath id="${id}"><path d="${sclera(s)}"/></clipPath><path d="${sclera(s)}" fill="${C.white}" ${LINE}/>` +
      `<g clip-path="url(#${id})"><ellipse class="pupil" cx="${-46 * s}" cy="-1660" rx="12" ry="16" fill="${C.ink}"/></g>` +
      `<path d="M${-90 * s} -1691 L${-30 * s} -1667 L${-32 * s} -1660 L${-84 * s} -1680 Z" fill="${C.ink}"/>`; },
    half: (s) => `<path d="${sclera(s)}" fill="${C.white}" ${LINE}/><path d="M${-86 * s} -1686 L${-33 * s} -1664 L${-34 * s} -1652 L${-84 * s} -1664 Z" fill="${C.skinSh}"/>` +
      `<path d="M${-90 * s} -1668 L${-30 * s} -1656 L${-31 * s} -1650 L${-84 * s} -1660 Z" fill="${C.ink}"/>`,
    closed: (s) => `<path d="M${-86 * s} -1660 Q${-58 * s} -1650 ${-33 * s} -1650" class="ln"/><path d="M${-84 * s} -1660 L${-33 * s} -1651 L${-35 * s} -1655 Z" fill="${C.ink}" ${LINE}/>`,
    happy: (s) => `<path d="M${-84 * s} -1644 Q${-60 * s} -1690 ${-32 * s} -1648 Q${-60 * s} -1678 ${-84 * s} -1644 Z" fill="${C.ink}" ${LINE}/>`,
    // shock (DAIMA, Netflix j5dwAVn4eJM 41.17 s): round white eyes with a dot for a pupil
    shock: (s) => `<ellipse cx="${-60 * s}" cy="-1666" rx="36" ry="39" fill="${C.white}" ${LINE}/><circle cx="${-58 * s}" cy="-1664" r="7.5" fill="${C.ink}"/>`,
  };
  const BROWS = {
    normal: (s) => `<path d="M${-98 * s} -1694 L${-27 * s} -1672 L${-24 * s} -1684 L${-90 * s} -1708 Z" fill="${C.ink}"/>`,
    angry: (s) => `<path d="M${-98 * s} -1704 L${-27 * s} -1666 L${-21 * s} -1680 L${-90 * s} -1716 Z" fill="${C.ink}"/>`,
    up: (s) => `<path d="M${-96 * s} -1694 L${-30 * s} -1690 L${-28 * s} -1702 L${-90 * s} -1710 Z" fill="${C.ink}"/>`,
  };
  const teeth = (d, band) => { const id = ID(); return `<clipPath id="${id}"><path d="${d}"/></clipPath><path d="${d}" fill="${C.mouth}"/><g clip-path="url(#${id})">${band}</g><path d="${d}" fill="none" ${LINE}/>`; };
  const MOUTHS = {
    closed: `<path d="M-22 -1567 Q0 -1571 22 -1567" class="ln"/><path d="M-12 -1552 Q0 -1550 12 -1552" class="fine"/>`,
    smile: `<path d="M-32 -1574 Q0 -1556 32 -1574" class="ln"/><path d="M-9 -1548 Q0 -1546 9 -1548" class="fine"/>`,
    a: teeth('M-27 -1575 Q0 -1580 27 -1575 Q21 -1543 0 -1539 Q-21 -1543 -27 -1575 Z', `<ellipse cx="0" cy="-1516" rx="21" ry="11" fill="${C.tongue}"/>`),
    o: teeth('M-15 -1573 Q0 -1578 15 -1573 Q15 -1549 0 -1547 Q-15 -1549 -15 -1573 Z', `<ellipse cx="0" cy="-1525" rx="10" ry="6" fill="${C.tongue}"/>`),
    grin: teeth('M-50 -1584 Q0 -1592 50 -1584 Q41 -1540 0 -1532 Q-41 -1540 -50 -1584 Z', `<path d="M-54 -1596 L54 -1596 L54 -1572 Q0 -1577 -54 -1572 Z" fill="${C.white}"/><ellipse cx="0" cy="-1510" rx="28" ry="12" fill="${C.tongue}"/>`),
    shout: teeth('M-40 -1586 Q0 -1592 40 -1586 Q34 -1522 0 -1512 Q-34 -1522 -40 -1586 Z', `<path d="M-42 -1596 L42 -1596 L42 -1576 Q0 -1580 -42 -1576 Z" fill="${C.white}"/><path d="M-42 -1506 L42 -1506 L42 -1524 Q0 -1519 -42 -1524 Z" fill="${C.white}"/><ellipse cx="0" cy="-1494" rx="23" ry="9" fill="${C.tongue}"/>`),
    grit: `<path d="M-44 -1582 Q0 -1590 44 -1582 L38 -1552 Q0 -1546 -38 -1552 Z" fill="${C.white}" ${LINE}/><path d="M-42 -1567 Q0 -1571 42 -1567" class="ln"/>`,
  };
  const group = (name, table, pair) => Object.keys(table).map((k) => `<g class="${name} ${name}-${k}">${pair ? eyePair(table[k]) : table[k]}</g>`).join('');
  return `<g class="headFront">
    ${hairWithSheen(spiky(lean(HAIR_F), 0, 0.13), HAIR_HI_F)}
    ${ear(1)}${ear(-1)}
    <path d="${FACE}" fill="${C.skin}" ${LINE}/>
    <path d="M110 -1650 L104 -1598 L75 -1545 L40 -1512 L36 -1520 Q84 -1580 86 -1660 Z M-104 -1598 L-75 -1545 L-52 -1524 Q-86 -1560 -94 -1600 Z" fill="${C.skinSh}"/>
    <path d="M-8 -1654 L-14 -1608 L-2 -1599 Z" fill="${C.skinSh}"/><path d="M-8 -1654 L-14 -1608 L4 -1598 M13 -1603 L18 -1607" class="fine"/>
    <path d="M-78 -1630 L-54 -1622 M-76 -1621 L-58 -1615 M78 -1630 L54 -1622 M76 -1621 L58 -1615" class="fine"/>
    ${group('eyes', EYES, 1)}${group('brows', BROWS, 1)}${group('mouth', MOUTHS)}
    <g class="sweat"><path d="M122 -1728 C134 -1706 144 -1688 142 -1676 C140 -1662 130 -1658 122 -1658 C114 -1658 104 -1664 103 -1676 C102 -1690 112 -1706 122 -1728 Z" fill="#BFE6FA" ${LINE}/><path d="M112 -1684 Q112 -1672 118 -1668" class="ln" style="stroke:#FFFFFF"/></g>
    <path d="M-108 -1740 L-94 -1688 L-72 -1730 L-50 -1676 L-28 -1730 L-2 -1662 L18 -1730 L46 -1678 L68 -1728 L102 -1686 L112 -1740 Z" fill="${C.skinSh}"/>
    <path d="${spiky(BANGS_F, 0.05)}" fill="${C.hair}"/><path d="${spiky(BANGS_F, 0.05, 0, 3)}" class="ln"/>
  </g>`;
}
function head3q() {
  // Turned to his left so he faces screen right, neck at x 45: the near ear sits back at -56..-16,
  // the near eye 22..78, the far eye narrows to 96..150 by the far cheek (152), the nose tip at
  // 124, the mouth at 100, the chin at 92.
  const FACE = 'M-18 -1718 L-24 -1650 Q-26 -1602 -12 -1578 L70 -1512 Q92 -1503 104 -1520 L116 -1556 L132 -1598 Q150 -1630 152 -1660 L144 -1718 Z';

function ik(S, W, L1, L2, bend) {

  const d = Math.max(Math.abs(L1 - L2) + 1, Math.min(L1 + L2 - 0.5, d0)), ux = dx / d0, uy = dy / d0;
