<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#CFEFFF" />
    <meta name="description" content="Businesses near you on a 3D map, each with its own mascot and billboard. Talk to the mascot, meet it at the door in AR, and walk in." />
    <title>Footfall map · Every business, its own mascot</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Footfall" />
    <meta property="og:title" content="Footfall map · Every business, its own mascot" />
    <meta property="og:description" content="Businesses near you on a 3D map, each with its own mascot and billboard. Talk to the mascot, meet it at the door in AR, and walk in." />
    <meta property="og:image" content="https://pellakurusumanth4-os-39c4.bolt.host/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Footfall" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The shops query and the map tiles start only after the app runs: open their connections now. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <!-- The shop list starts loading now, beside the app's script instead of after it (useShops takes this answer first). -->
    <script>window.saathShops = '%SAATH_SHOPS%' && fetch('%SAATH_SHOPS%').then((r) => (r.ok ? r.json() : null)).catch(() => null);</script>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <!-- The first screen while the app's script loads (the app replaces it): the brand and grey rows where the shops go. -->
      <style>
        .boot .sk-thumb { width: 92px; height: 52px; }
        @media (min-width: 1280px) {
          .boot .near-sheet { top: 20px; bottom: 20px; left: 20px; right: auto; width: 384px; max-width: none; height: auto; margin: 0; border-radius: var(--r-panel); padding: 18px 20px 0; }
          .boot .grabber { display: none; }
          .boot .sk-thumb { width: 76px; height: 43px; }
          .boot .boot-gap { height: 244px; }   /* where the desktop panel puts the search and the category chips */
        }
      </style>
      <div class="app boot">
        <div class="map-wrap"></div>
        <div class="sheet glass-sheet near-sheet">
          <div class="grabber"></div>
          <div class="brand"><img src="/icons/favicon.svg" alt="" width="40" height="40" /><div><b>footfall</b><span>Businesses near you</span></div></div>
          <div class="boot-gap"></div>
          <section class="near" aria-label="Shops near you">
            <div class="near-head"><h2>Near you</h2></div>
            <ul class="near-rows" aria-busy="true">
              <li class="near-skeleton" aria-hidden="true"><span class="sk-thumb"></span><span class="sk-lines"><i></i><i></i><i></i></span></li>
              <li class="near-skeleton" aria-hidden="true"><span class="sk-thumb"></span><span class="sk-lines"><i></i><i></i><i></i></span></li>
              <li class="near-skeleton" aria-hidden="true"><span class="sk-thumb"></span><span class="sk-lines"><i></i><i></i><i></i></span></li>
            </ul>
          </section>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
